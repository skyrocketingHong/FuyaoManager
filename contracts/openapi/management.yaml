openapi: 3.0.3
info:
  title: Fuyao Management API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Local development MVP of the FuyaoHomepage management backend.

    Scope of this contract (and of the implementation it describes):

    - Passkey-only authentication (WebAuthn discoverable credentials, user
      verification required). There is no password, bearer token, or
      development-admin login.
    - First-run bootstrap: the local `fuyao-admin bootstrap-admin` CLI issues a
      short-lived single-use enrollment permit; the permit authorizes passkey
      enrollment only and is never a login credential.
    - Cookie sessions with server-side revocation, CSRF token enforcement, and
      strict Origin checking on unsafe methods.
    - Site list, site detail, and site settings with strong ETags and
      mandatory If-Match on updates.
    - Theme catalog reading and per-site theme selection with configuration
      persisted against each theme's own configuration schema. Themes are
      registered by the operator-driven `fuyao-admin register-theme` CLI;
      the HTTP surface never accepts file paths, shell commands, or Git
      addresses, and the catalog never exposes server-side source paths.
    - Persistent build-preview tasks: creation freezes the site settings and
      theme selection version view, the executor runs the trusted adapter
      sequence against the registered theme source, and succeeded builds get
      short-lived private preview links on per-build loopback origins.
      Filesystem locations and executor internals are never exposed.

    Not implemented in this package (and therefore not described here):
    Tailscale private-network exposure, the 30-minute public gate, articles,
    pages, modules, multi-site fan-out, key/source build operations, and the
    admin front end.

    The server binds loopback only. The default development origin is
    http://localhost:5174 with relying-party ID `localhost`.
servers:
  - url: http://localhost:8787
    description: Local development server (loopback binding only)

tags:
  - name: Auth
    description: WebAuthn enrollment and login ceremonies.
  - name: Session
    description: Session introspection and logout.
  - name: Sites
    description: Site listing, detail, and settings.
  - name: Themes
    description: Theme catalog and per-site theme selection.
  - name: Builds
    description: Build-preview tasks and private preview links.
  - name: Releases
    description: Publishing, release history, and rollback.

security:
  - sessionCookie: []

paths:
  /api/v1/auth/register/options:
    post:
      operationId: startPasskeyEnrollment
      tags: [Auth]
      summary: Start passkey enrollment with a bootstrap permit
      description: |
        Exchanges a single-use enrollment permit (generated by the local
        `fuyao-admin bootstrap-admin` command) for WebAuthn credential
        creation options. The permit lookup is attempt-limited and expires
        quickly; the permit is only valid while no administrator has
        registered yet.

        The response sets a short-lived `fuyao_admin_auth_tx` cookie
        (HttpOnly, scoped to `/api/v1/auth`) that binds the ceremony state.
        The challenge is single-use and server-side enforced.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentPermitRequest'
            examples:
              permit:
                value: { 'permit': 'MFRG-GZYT-MZWU-4TCO' }
      responses:
        '200':
          description: Creation options for `navigator.credentials.create()`.
          headers:
            Set-Cookie:
              description: Ceremony cookie `fuyao_admin_auth_tx`; path /api/v1/auth; HttpOnly; SameSite=Lax.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationOptionsEnvelope'
        '400':
          $ref: '#/components/responses/InvalidPermit'
        '409':
          description: An administrator is already registered; the enrollment window is closed (`bootstrap_closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/register/verify:
    post:
      operationId: verifyPasskeyEnrollment
      tags: [Auth]
      summary: Complete passkey enrollment
      description: |
        Verifies the attestation produced by `navigator.credentials.create()`
        against the challenge bound to the `fuyao_admin_auth_tx` cookie. The
        ceremony state is consumed atomically before verification, so a
        challenge can never be replayed or brute-forced. On success the permit
        is claimed, the user becomes active, and a session cookie plus a
        one-time CSRF token are issued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreationResponse'
      responses:
        '200':
          description: Enrollment complete; the caller is signed in.
          headers:
            Set-Cookie:
              description: Session cookie `fuyao_admin_session` (HttpOnly, SameSite=Lax); the ceremony cookie is cleared.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyDone'
        '401':
          description: |
            Challenge unknown/expired/consumed (`challenge_invalid`) or the
            attestation failed verification (`credential_rejected`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                challenge:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unauthorized',
                      'status': 401,
                      'code': 'challenge_invalid',
                      'detail': 'The authentication challenge is unknown, expired, or already used.'
                    }
                rejected:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unauthorized',
                      'status': 401,
                      'code': 'credential_rejected',
                      'detail': 'The passkey registration response failed verification.'
                    }
        '409':
          description: |
            Enrollment closure: the permit was already used (`permit_used`),
            expired while its ceremony was in flight (`permit_expired`), or an
            administrator is already registered (`bootstrap_closed`). Permit
            consumption, credential write, and user activation commit in one
            transaction, so concurrent first enrollments never both succeed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: The body is not a single JSON object (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/login/options:
    post:
      operationId: startPasskeyLogin
      tags: [Auth]
      summary: Start discoverable passkey login
      description: |
        Returns assertion options for a discoverable-credential
        (`navigator.credentials.get()` with an empty allow list) login with
        user verification required. Sets the short-lived
        `fuyao_admin_auth_tx` ceremony cookie.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Assertion options for `navigator.credentials.get()`.
          headers:
            Set-Cookie:
              description: Ceremony cookie `fuyao_admin_auth_tx`; path /api/v1/auth; HttpOnly; SameSite=Lax.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertionOptionsEnvelope'
        '400':
          description: The body is not a single JSON object (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin rejected (`origin_rejected`); unsafe methods require an allowed Origin.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/login/verify:
    post:
      operationId: verifyPasskeyLogin
      tags: [Auth]
      summary: Complete discoverable passkey login
      description: |
        Verifies the assertion against the challenge bound to the
        `fuyao_admin_auth_tx` cookie. The user is resolved from the
        authenticator's user handle; origin, RP ID hash, signature, user
        verification, and the signature counter are verified by the server.
        The ceremony state is consumed before verification, so challenges are
        single-use even on failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAssertionResponse'
      responses:
        '200':
          description: Login complete; a session cookie and CSRF token are issued.
          headers:
            Set-Cookie:
              description: Session cookie `fuyao_admin_session`; the ceremony cookie is cleared.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyDone'
        '401':
          description: Challenge invalid (`challenge_invalid`) or assertion rejected (`credential_rejected`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: The body is not a single JSON object (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/session:
    get:
      operationId: getSession
      tags: [Session]
      summary: Query the current session
      description: |
        Returns the session state. An authenticated caller receives the
        session's stable CSRF token, identical on every read, so multiple
        tabs stay writable; an anonymous or expired caller receives
        `authenticated: false` (with status 200), so the endpoint doubles as
        the login-state probe for the admin front end.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: Session state. `user` and `csrfToken` are present only when authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                authenticated:
                  value:
                    authenticated: true
                    user:
                      {
                        'id': '018f3c1e-6a2c-7b41-9f22-3f0a1c7d5b88',
                        'username': 'alice',
                        'displayName': 'Alice'
                      }
                    csrfToken: 'dGhpc0lzQUNzcmZUb2tlbg'
                anonymous:
                  value: { 'authenticated': false }
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Session]
      summary: Revoke the current session
      description: |
        Revokes the session server-side and clears the cookie. Requires the
        session cookie, the CSRF token header, and an allowed Origin.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites:
    get:
      operationId: listSites
      tags: [Sites]
      summary: List sites the caller belongs to
      description: Returns exactly the sites in which the authenticated user holds a membership, newest first.
      responses:
        '200':
          description: Membership-scoped site list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}:
    get:
      operationId: getSite
      tags: [Sites]
      summary: Get one member site
      description: Returns the site with the caller's role. Non-members receive 404 so site existence is not leaked across accounts.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/settings:
    get:
      operationId: getSiteSettings
      tags: [Sites]
      summary: Read site settings
      description: Returns the editable settings plus the strong ETag used for optimistic concurrency. Any member (including viewers) may read.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Current settings.
          headers:
            ETag:
              description: Strong entity tag `"<siteId>-r<revision>"` for use in If-Match.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateSiteSettings
      tags: [Sites]
      summary: Update site settings (If-Match required)
      description: |
        Partially updates `name`, `description`, and `defaultLocale`. The
        request must carry the session cookie, the CSRF token header, an
        allowed Origin, and an `If-Match` header with this site's exact ETag
        from a prior GET (wildcards are rejected). The ETag embeds the site
        UUID, so tags belonging to other sites fail even at equal revisions.
        The revision comparison and bump happen inside one PostgreSQL
        transaction, so concurrent writers cannot both succeed.

        Only `owner` and `editor` members may write; viewers get 403 and
        non-members get 404. Unknown JSON fields, empty patches, invalid
        locales, and over-length values are rejected with 400.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteSettingsPatch'
            examples:
              rename:
                value: { 'name': 'Fuyao Blog', 'defaultLocale': 'en-US' }
      responses:
        '200':
          description: Updated settings; a new strong ETag is returned.
          headers:
            ETag:
              description: Strong ETag of the new revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '400':
          description: Validation failure (`validation_error` or `invalid_if_match`/`invalid_site_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknownField:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Bad Request',
                      'status': 400,
                      'code': 'validation_error',
                      'detail': 'Invalid JSON body: json: unknown field "unexpected"'
                    }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The ETag is stale or belongs to a different resource (`precondition_failed`); the current ETag is returned in the ETag response header.
          headers:
            ETag:
              description: Current (fresher) entity tag.
              schema: { type: string }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match is missing (`precondition_required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/themes:
    get:
      operationId: listThemes
      tags: [Themes]
      summary: List registered themes
      description: |
        Returns the theme catalog. Entries are registered by the
        operator-driven `fuyao-admin register-theme` CLI; each entry carries
        the validated manifest content, the manifest digest that distinguishes
        registrations, and the theme's own configuration schema for rendering
        the per-site configuration form. Server-side source paths and other
        filesystem details are never exposed. Any authenticated administrator
        may read the catalog, viewers included.
      responses:
        '200':
          description: Theme catalog, ordered by theme id and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeList'
              examples:
                firstTheme:
                  value:
                    themes:
                      - id: '0192ab3c-4d5e-6f70-8192-ab3c4d5e6f70'
                        themeId: fuyao-homepage
                        version: '27.1.1'
                        name: Fuyao Homepage
                        description: The original SvelteKit public site registered as the first theme.
                        adapter: node22-sveltekit-static
                        inputProtocol: fuyao.theme.build-input/v1
                        capabilities: [blog, albums, footprint, friends, pay, favicon]
                        outputs:
                          spaFallback: 200.html
                          urlConventions:
                            [
                              release.json,
                              posts,
                              data,
                              media-albums,
                              sitemap,
                              blog-rss,
                              blog-search
                            ]
                          requiredArtifacts: [sitemap.xml, blog/rss.xml]
                        configSchema:
                          {
                            '$schema': 'https://json-schema.org/draft/2020-12/schema',
                            'title': 'Fuyao Homepage theme configuration (v1)',
                            'type': 'object',
                            'additionalProperties': false
                          }
                        manifestDigest: '9f2c7c14ad5b3e6f8192ab3c4d5e6f701234567890abcdef12345678abcdef12'
                        registeredAt: '2026-11-11T08:00:00Z'
                        updatedAt: '2026-11-11T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/theme:
    get:
      operationId: getSiteTheme
      tags: [Themes]
      summary: Read the site theme selection
      description: |
        Returns the site's selected theme registration and its configuration
        plus the strong ETag used for optimistic concurrency. Revision 0 with
        `selected: false` means no selection yet (ETag `"<siteId>-t0"`). Any
        member (including viewers) may read; non-members get 404. The theme
        selection revision is independent of the site settings revision, so
        editing settings never overwrites a concurrent theme selection and
        vice versa.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Current selection.
          headers:
            ETag:
              description: Strong entity tag `"<siteId>-t<revision>"` for use in If-Match.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteThemeSelection'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putSiteTheme
      tags: [Themes]
      summary: Save the site theme selection (If-Match required)
      description: |
        Saves the site's theme selection and its configuration. The theme and
        version must exist in the catalog (404 `theme_not_found` otherwise),
        and the configuration must satisfy the theme's own configuration
        schema (422 `invalid_theme_config`; themes without a declared schema
        accept only `{}`). Invalid input is never silently downgraded.

        The request must carry the session cookie, the CSRF token header, an
        allowed Origin, and an `If-Match` header with this site's exact theme
        ETag from a prior GET (wildcards are rejected). Revision 0 creates the
        first selection. The revision comparison and bump happen inside one
        PostgreSQL transaction on a counter independent of the site settings
        revision.

        Only `owner` and `editor` members may write; viewers get 403 and
        non-members get 404. Servers started without
        `FUYAO_ADMIN_THEME_CONTRACTS` reject the save with 503
        `theme_contracts_unavailable` instead of skipping validation.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteThemeSelectionPut'
            examples:
              selectFirstTheme:
                value: { 'themeId': 'fuyao-homepage', 'version': '27.1.1', 'themeConfig': {} }
      responses:
        '200':
          description: Saved selection; a new strong ETag is returned.
          headers:
            ETag:
              description: Strong ETag of the new revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteThemeSelection'
        '400':
          description: Validation failure (`validation_error` or `invalid_if_match`/`invalid_site_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Site or theme not found (`not_found` or `theme_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                themeNotFound:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Not Found',
                      'status': 404,
                      'code': 'theme_not_found',
                      'detail': 'The theme and version are not registered in the catalog.'
                    }
        '412':
          description: The ETag is stale or belongs to a different resource (`precondition_failed`); the current ETag is returned in the ETag response header.
          headers:
            ETag:
              description: Current (fresher) entity tag.
              schema: { type: string }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The theme configuration does not satisfy the theme's configuration schema (`invalid_theme_config`). The exact validation error is logged server-side; the response detail never embeds validator internals or local paths.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknownOption:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unprocessable Entity',
                      'status': 422,
                      'code': 'invalid_theme_config',
                      'detail': "The theme configuration does not satisfy the theme's configuration schema."
                    }
        '428':
          description: If-Match is missing (`precondition_required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Theme contract validation is not configured on the server (`theme_contracts_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/builds:
    post:
      operationId: createBuild
      tags: [Builds]
      summary: Enqueue a build-preview task
      description: |
        Creates a persistent build task for the site. The creation transaction
        freezes the exact version view — the current site settings snapshot
        with its revision and the current theme selection with its revision —
        into the task row; later edits never leak into a running build. The
        task starts `queued`; the executor (a single cluster-wide advisory-lock
        holder) claims it and persists every state transition, so the result
        stays queryable through this API regardless of server restarts.

        Only `owner` and `editor` members may trigger builds; viewers get 403
        and non-members get 404. The request needs the session cookie, the
        CSRF token header, and an allowed Origin, but no body.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '202':
          description: Task accepted and queued; the task state is returned, not the build result.
          headers:
            Location:
              description: Absolute path of the created task resource.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTask'
              examples:
                queuedTask:
                  value:
                    {
                      'id': '0192ab3c-4d5e-6f70-8192-ab3c4d5e6f71',
                      'siteId': '018f3c1e-7a2b-4c3d-9e4f-0a1b2c3d4e5f',
                      'status': 'queued',
                      'requestedBy': '018f3c1e-7a2b-4c3d-9e4f-0a1b2c3d4e10',
                      'theme':
                        {
                          'themeId': 'fuyao-homepage',
                          'version': '27.1.1',
                          'manifestDigest': '9f2c7c14ad5b3e6f8192ab3c4d5e6f701234567890abcdef12345678abcdef12'
                        },
                      'themeConfig': {},
                      'siteSettings':
                        {
                          'site':
                            {
                              'name': 'Fuyao',
                              'description': 'Personal site',
                              'defaultLocale': 'zh-CN'
                            }
                        },
                      'siteSettingsRevision': 3,
                      'themeSelectionRevision': 1,
                      'failure': null,
                      'inputDigests': null,
                      'createdAt': '2026-11-11T09:00:00Z'
                    }
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The site has no theme selection yet (`no_theme_selected`); save one first.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The build executor is not configured on this server (`build_runner_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listBuilds
      tags: [Builds]
      summary: List the site's build tasks
      description: |
        Returns the caller's site builds, newest first. Any site member
        (including viewers) may read; non-members get 404. Task rows carry the
        frozen version view, the persisted failure record (if any), and the
        input digests (on success) — never filesystem locations.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Build list, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [builds]
                properties:
                  builds:
                    type: array
                    items:
                      $ref: '#/components/schemas/BuildTask'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/builds/{buildId}:
    get:
      operationId: getBuild
      tags: [Builds]
      summary: Read one build task
      description: |
        Returns one task's persisted state for re-query (for example while it
        is queued or running, or after a restart). Any site member may read;
        non-members and foreign build ids get 404 (`build_not_found`).
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/BuildId'
      responses:
        '200':
          description: The task's current persisted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildTask'
        '400':
          description: The siteId or buildId path segment is not a UUID (`invalid_site_id` or `invalid_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Task not found on this site for this caller (`build_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/builds/{buildId}/preview-links:
    post:
      operationId: createPreviewLink
      tags: [Builds]
      summary: Mint a private preview link
      description: |
        Issues a short-lived preview URL for a succeeded build. The URL lives
        on the build's own loopback-only origin — separate from both the
        management API origin and every other build — and carries a one-time
        token that the preview origin exchanges for an HttpOnly cookie. The
        preview origin never sees the management session cookie, so theme
        scripts cannot read management responses.

        Any site member (including viewers) may preview. Links exist only for
        builds in `succeeded` state whose artifacts are still available;
        anything else is 409 `build_not_succeeded`.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/BuildId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '201':
          description: Preview link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewLink'
              examples:
                freshLink:
                  value:
                    {
                      'url': 'http://127.0.0.1:41231/enter#one-time-token',
                      'expiresAt': '2026-11-11T09:15:00Z'
                    }
        '400':
          description: The siteId or buildId path segment is not a UUID (`invalid_site_id` or `invalid_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Task not found on this site for this caller (`build_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The build has not succeeded or its artifacts are no longer available (`build_not_succeeded`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The preview server is not configured on this server (`preview_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/releases:
    post:
      operationId: createRelease
      tags: [Releases]
      summary: Publish a succeeded build as the site's live release
      description: |
        Promotes a succeeded build to the site's live release. The pipeline
        re-checks the trusted site requirements (capabilities and URL
        conventions), verifies the theme's declared `requiredArtifacts` exist
        in the build output, generates `release.json` and validates it against
        the theme release contract, seals the artifacts into an immutable
        per-site release directory, and switches the site's current release
        atomically under the per-site publish lock. A failed publish is
        persisted as a release record with its failure (precise missing
        capabilities, URL conventions, or artifacts) and returns 422 — the
        previous release stays live and serving. Failed attempts stay in the
        history and the same build may be retried after the fault clears.

        One active release per build: republishing a build that already backs
        a live or superseded release is 409 `release_build_conflict` (roll
        back to it instead). Only `owner` and `editor` members may publish.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReleaseCreate'
            examples:
              manualPublish:
                value: { 'buildId': '0192ab3c-4d5e-6f70-8192-ab3c4d5e6f72', 'reasons': ['manual'] }
      responses:
        '201':
          description: Published and live; a Location header points at the release resource.
          headers:
            Location:
              description: Absolute path of the created release resource.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '409':
          description: The build already backs a live or superseded release (`release_build_conflict`); roll back to it instead of republishing.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: |
            Either the build cannot back a release (`build_not_publishable`:
            missing, not succeeded, or foreign site — an `application/problem+json`
            body), or the publish attempt failed its checks and was persisted —
            in that case the body is `application/json` carrying the failed
            release record with the precise missing items.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notPublishable:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unprocessable Entity',
                      'status': 422,
                      'code': 'build_not_publishable',
                      'detail': 'Only a succeeded build of this site can be published.'
                    }
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
              examples:
                publishFailed:
                  value:
                    {
                      'id': '0192ab3c-4d5e-6f70-8192-ab3c4d5e6f73',
                      'siteId': '018f3c1e-7a2b-4c3d-9e4f-0a1b2c3d4e5f',
                      'buildId': '0192ab3c-4d5e-6f70-8192-ab3c4d5e6f72',
                      'status': 'failed',
                      'theme':
                        {
                          'themeId': 'fuyao-homepage',
                          'version': '27.1.1',
                          'manifestDigest': '9f2c7c14ad5b3e6f8192ab3c4d5e6f701234567890abcdef12345678abcdef12'
                        },
                      'inputDigests':
                        {
                          'contentDigest': 'sha256:1fbc59634b6d5bc4f579abf4f6ccb4e617af6be57ac7c7fb31198b2731e82690',
                          'siteConfigDigest': 'sha256:98e1b1219d45e306d735fc84f3964eec61dfe455d3de7a627974ad27ce358a3a',
                          'themeConfigDigest': 'sha256:44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a'
                        },
                      'routes': { 'spaFallback': '200.html', 'urlConventions': [posts] },
                      'reasons': ['manual'],
                      'failure':
                        {
                          'stage': 'artifacts',
                          'message': 'The build output is missing artifacts the theme requires for a release.',
                          'missingArtifacts': ['sitemap.xml']
                        },
                      'createdBy': '018f3c1e-7a2b-4c3d-9e4f-0a1b2c3d4e10',
                      'createdAt': '2026-11-11T10:00:00Z',
                      'activatedAt': null,
                      'supersededAt': null
                    }
        '503':
          description: The publish pipeline or theme contracts are not configured (`publish_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: listReleases
      tags: [Releases]
      summary: List the site's release history
      description: |
        Returns the site's releases, newest first: live, superseded, and
        failed attempts with their failure records. Any site member may read;
        non-members get 404.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Release history, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [releases]
                properties:
                  releases:
                    type: array
                    items:
                      $ref: '#/components/schemas/Release'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/releases/{releaseId}:
    get:
      operationId: getRelease
      tags: [Releases]
      summary: Read one release record
      description: |
        Returns one release record — live, superseded, or a failed attempt
        with its persisted failure detail. This is the resource the
        `Location` header of a publish response points at. Any site member
        may read; non-members and foreign ids get 404 (`release_not_found`).
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ReleaseId'
      responses:
        '200':
          description: The release record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          description: The siteId or releaseId path segment is not a UUID (`invalid_site_id` or `invalid_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: Release not found on this site for this caller (`release_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                notFound:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Not Found',
                      'status': 404,
                      'code': 'release_not_found',
                      'detail': 'The release does not exist on this site.'
                    }
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/release:
    get:
      operationId: getCurrentRelease
      tags: [Releases]
      summary: Read the current live release
      description: |
        Returns the site's live release plus the published origin URL — a
        loopback-only origin serving the current release with production URL
        semantics. Publishing or rolling back switches the served content
        without changing the URL. Any site member may read; 404
        `no_live_release` before the first publish.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Current release and its published origin.
          content:
            application/json:
              schema:
                type: object
                required: [release, originUrl]
                properties:
                  release:
                    $ref: '#/components/schemas/Release'
                  originUrl:
                    type: string
                    description: Loopback origin serving the current release, or an empty string when the published-origin service is not configured.
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: No membership or no live release yet (`not_found` or `no_live_release`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/releases/{releaseId}/rollback:
    post:
      operationId: rollbackRelease
      tags: [Releases]
      summary: Roll the site back to an existing release
      description: |
        Atomically re-points the site at an existing release: artifacts are
        reused exactly as sealed (no rebuild) and nothing outside the pointer
        — settings, theme selections, builds, unpublished edits — is touched.
        The target must exist on this site, not be a failed attempt, and its
        release directory must still be present. Rolling back to the
        currently-live release is 409. Only `owner` and `editor` members may
        roll back.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ReleaseId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '200':
          description: The release is live again; the previously-live release is superseded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          description: The siteId or releaseId path segment is not a UUID (`invalid_site_id` or `invalid_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Release not found on this site for this caller (`release_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: The target cannot become live — already live, a failed attempt, or artifacts missing (`release_not_rollbackable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The publish pipeline is not configured (`publish_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: fuyao_admin_session
      description: |
        Server-side session cookie (HttpOnly, SameSite=Lax; Secure in any
        https configuration). Sessions are revocable and expire server-side.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF token returned by the ceremony endpoints and rotated by
        GET /api/v1/session. Required, alongside an allowed Origin, on every
        authenticated mutating request.

  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      description: Site UUID.
      schema:
        type: string
        format: uuid
    BuildId:
      name: buildId
      in: path
      required: true
      description: Build task UUID.
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: Release record UUID.
      schema:
        type: string
        format: uuid
    CSRFTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the session.
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The exact strong ETag of this site's settings as returned by GET
        settings (for example `"018f3c1e-...-r3"`). The ETag embeds the site
        UUID and the revision, so a tag from another site is rejected. The
        wildcard form `*` is not accepted: updates must not bypass optimistic
        locking. A missing header is rejected with 428; a foreign, malformed,
        or stale tag with 412/400 respectively.
      schema:
        type: string
        pattern: '^"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-r[1-9][0-9]*"$'
        minLength: 1

  responses:
    Problem:
      description: Unexpected error; the body never leaks SQL or connection details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No or invalid session (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: CSRF token invalid (`csrf_token_invalid`), Origin rejected (`origin_rejected`), or insufficient role (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or the caller has no membership (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidSiteId:
      description: The siteId path parameter is not a UUID (`invalid_site_id`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidPermit:
      description: Permit unknown, expired, used, or out of attempts (`invalid_permit`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequestBodyTooLarge:
      description: Body exceeds 1 MiB (`request_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type must be application/json (`unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    BuildFailure:
      type: object
      description: Persisted failure record of a build task.
      required: [stage, message]
      properties:
        stage:
          type: string
          description: The stage the task died in (capability-check, theme-lookup, theme-changed, theme-root, theme-source-changed, theme-manifest, workspace, snapshot, prepare, build, harvest, interrupted, internal).
        message:
          type: string
          description: Client-safe message; never contains server paths.
        missingCapabilities:
          type: array
          items: { type: string }
          description: Required capabilities the theme does not declare (capability-check stage only).
        missingUrlConventions:
          type: array
          items: { type: string }
          description: Required URL conventions the theme does not declare (capability-check stage only).
        exitCode:
          type: integer
          description: Process exit code when a command step failed.

    BuildTask:
      type: object
      description: |
        A persistent build-preview task. The identity block (theme, themeConfig,
        siteSettings, both revisions) is frozen at creation and is the only
        input the executor consumes. Filesystem locations are never exposed.
      required:
        [
          id,
          siteId,
          status,
          requestedBy,
          theme,
          themeConfig,
          siteSettings,
          siteSettingsRevision,
          themeSelectionRevision,
          createdAt
        ]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        requestedBy: { type: string, format: uuid }
        theme:
          type: object
          required: [themeId, version, manifestDigest]
          properties:
            themeId: { type: string }
            version: { type: string }
            manifestDigest: { type: string }
        themeConfig:
          type: object
          description: The frozen theme configuration captured at creation.
        siteSettings:
          type: object
          description: The frozen public site settings snapshot captured at creation.
          required: [site]
          properties:
            site:
              type: object
              required: [name, description, defaultLocale]
              properties:
                name: { type: string }
                description: { type: string }
                defaultLocale: { type: string }
        siteSettingsRevision: { type: integer, format: int64 }
        themeSelectionRevision: { type: integer, format: int64 }
        failure:
          oneOf:
            - $ref: '#/components/schemas/BuildFailure'
            - enum: [null]
          description: Present (non-null) only for `failed` tasks; null while queued, running, or succeeded.
        inputDigests:
          type: object
          nullable: true
          required: [contentDigest, siteConfigDigest, themeConfigDigest]
          additionalProperties: false
          properties:
            contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            siteConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            themeConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          description: |
            The three input digests recorded by the theme preparation flow:
            `contentDigest`, `siteConfigDigest`, and `themeConfigDigest`
            SHA-256 strings. Present only for `succeeded` tasks; null while
            queued, running, or failed.
        sourceDigest:
          type: string
          nullable: true
          description: Aggregate SHA-256 over the task's private source copy (every copied file's path and digest, sorted) once the copy is materialized; broader than the manifest digest, which covers theme.json only.
        sourceFileCount:
          type: integer
          nullable: true
          description: Number of source files the task's private copy recorded.
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    PreviewLink:
      type: object
      description: A short-lived private preview URL on a per-build loopback origin.
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: Entry URL carrying a one-time token exchanged for an HttpOnly cookie on the preview origin.
        expiresAt: { type: string, format: date-time }

    ReleaseCreate:
      type: object
      description: Publish request body.
      required: [buildId]
      properties:
        buildId:
          type: string
          format: uuid
          description: The succeeded build whose artifacts become the release.
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [manual, posts, albums, data, favicon, static]
          description: Why the release is produced (mirrored into release.json); omitted defaults to [manual].
      additionalProperties: false

    ReleaseFailure:
      type: object
      description: Persisted failure record of a publish attempt.
      required: [stage, message]
      properties:
        stage:
          type: string
          description: The stage the publish died in (capability-check, artifacts, workspace, release-metadata, persist).
        message:
          type: string
          description: Client-safe message; never contains server paths.
        missingCapabilities:
          type: array
          items: { type: string }
          description: Required capabilities the theme does not declare (capability-check stage only).
        missingUrlConventions:
          type: array
          items: { type: string }
          description: Required URL conventions the theme does not declare (capability-check stage only).
        missingArtifacts:
          type: array
          items: { type: string }
          description: Theme-declared requiredArtifacts missing from the build output (artifacts stage only).

    Release:
      type: object
      description: |
        A persisted release record. One release per build; the live one is
        what the published origin serves. The theme identity and input
        digests identify the exact content/theme/configuration triple, which
        is what rollback restores. Filesystem locations are never exposed.
      required:
        [id, siteId, buildId, status, theme, inputDigests, routes, reasons, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        buildId:
          type: string
          format: uuid
          description: The succeeded build whose sealed artifacts back this release.
        theme:
          type: object
          required: [themeId, version, manifestDigest]
          properties:
            themeId: { type: string }
            version: { type: string }
            manifestDigest: { type: string }
        inputDigests:
          type: object
          nullable: true
          required: [contentDigest, siteConfigDigest, themeConfigDigest]
          additionalProperties: false
          properties:
            contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            siteConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            themeConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          description: |
            The three input digests the release was built from
            (`contentDigest`, `siteConfigDigest`, `themeConfigDigest`
            SHA-256 strings). A release always backs a succeeded build, so
            the object carries all three fields; null only as a defensive
            state when no digest could be carried.
        routes:
          type: object
          required: [spaFallback, urlConventions]
          properties:
            spaFallback:
              type: string
              nullable: true
              description: The SPA fallback file mirrored from the theme manifest (null when the theme declares none).
            urlConventions:
              type: array
              items: { type: string }
        reasons:
          type: array
          items:
            enum: [manual, posts, albums, data, favicon, static]
        status:
          type: string
          enum: [live, superseded, failed]
        failure:
          oneOf:
            - $ref: '#/components/schemas/ReleaseFailure'
            - enum: [null]
          description: Present (non-null) only for `failed` attempts; null otherwise.
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the release last became live.
        supersededAt:
          type: string
          format: date-time
          nullable: true
          description: When a newer publish or rollback replaced this release.

    Problem:
      type: object
      description: RFC 9457 error document with a stable machine-readable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: One of unauthenticated, csrf_token_invalid, origin_rejected, forbidden, not_found, invalid_site_id, invalid_permit, permit_used, permit_expired, bootstrap_closed, challenge_invalid, credential_rejected, validation_error, invalid_json, invalid_if_match, precondition_required, precondition_failed, request_too_large, unsupported_media_type, theme_not_found, invalid_theme_config, theme_contracts_unavailable, no_theme_selected, build_not_found, build_not_succeeded, build_runner_unavailable, preview_unavailable, publish_unavailable, build_not_publishable, release_build_conflict, release_not_found, release_not_rollbackable, no_live_release, invalid_id, internal_error.
          enum:
            - unauthenticated
            - csrf_token_invalid
            - origin_rejected
            - forbidden
            - not_found
            - invalid_site_id
            - invalid_permit
            - permit_used
            - permit_expired
            - bootstrap_closed
            - challenge_invalid
            - credential_rejected
            - validation_error
            - invalid_json
            - invalid_if_match
            - precondition_required
            - precondition_failed
            - request_too_large
            - unsupported_media_type
            - theme_not_found
            - invalid_theme_config
            - theme_contracts_unavailable
            - no_theme_selected
            - invalid_id
            - preview_unavailable
            - build_runner_unavailable
            - build_not_succeeded
            - build_not_found
            - publish_unavailable
            - build_not_publishable
            - release_build_conflict
            - release_not_found
            - release_not_rollbackable
            - no_live_release
            - internal_error
        detail:
          type: string

    User:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
        displayName:
          type: string
          maxLength: 200

    CeremonyDone:
      type: object
      description: Successful enrollment or login; the CSRF token is stable for the whole session and must be echoed on mutating requests.
      required: [user, csrfToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string

    SessionInfo:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string

    EnrollmentPermitRequest:
      type: object
      required: [permit]
      properties:
        permit:
          type: string
          pattern: '^[A-Z2-7]{4}(-[A-Z2-7]{4}){3}$'
          description: Single-use permit code printed by `fuyao-admin bootstrap-admin`.
      additionalProperties: false

    Site:
      type: object
      required:
        [
          siteId,
          slug,
          name,
          description,
          defaultLocale,
          role,
          settingsRevision,
          createdAt,
          updatedAt
        ]
      properties:
        siteId:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        name:
          type: string
        description:
          type: string
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
        role:
          type: string
          enum: [owner, editor, viewer]
          description: The caller's role in this site.
        settingsRevision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SiteList:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'

    SiteSettings:
      type: object
      required: [siteId, name, description, defaultLocale, revision, updatedAt]
      properties:
        siteId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
        revision:
          type: integer
          format: int64
          minimum: 1
        updatedAt:
          type: string
          format: date-time

    SiteSettingsPatch:
      type: object
      description: At least one field must be present; name is trimmed before validation.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
      additionalProperties: false

    Theme:
      type: object
      description: |
        One registered (theme id, version) catalog entry. Registered by the
        operator-driven `fuyao-admin register-theme` CLI after full contract
        validation; the manifest digest distinguishes the exact theme.json
        bytes behind the entry. Server-side source paths are never exposed.
      required:
        [
          id,
          themeId,
          version,
          adapter,
          inputProtocol,
          capabilities,
          outputs,
          configSchema,
          manifestDigest,
          registeredAt,
          updatedAt
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Catalog row id.
        themeId:
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        version:
          type: string
          description: SemVer 2.0.0 theme version.
        name:
          type: string
        description:
          type: string
        adapter:
          type: string
          description: Trusted build adapter this theme requires (currently `node22-sveltekit-static`).
        inputProtocol:
          type: string
          description: Build-input snapshot protocol the theme consumes (`fuyao.theme.build-input/v1`).
        capabilities:
          type: array
          items:
            type: string
            enum: [blog, albums, footprint, friends, pay, favicon]
          description: Content capabilities the theme declares.
        outputs:
          type: object
          required: [spaFallback, urlConventions, requiredArtifacts]
          properties:
            spaFallback:
              type: string
              nullable: true
              description: SPA fallback page inside a release, or null when every route is prerendered.
            urlConventions:
              type: array
              items:
                type: string
                enum: [release.json, posts, data, media-albums, sitemap, blog-rss, blog-search]
            requiredArtifacts:
              type: array
              items:
                type: string
        configSchema:
          type: object
          nullable: true
          description: The theme's own JSON Schema (draft 2020-12) document the per-site themeConfig must satisfy; null when the theme declares none (only `{}` is valid).
        manifestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hex SHA-256 digest of the exact theme.json bytes registered.
        registeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ThemeList:
      type: object
      required: [themes]
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/Theme'

    SiteThemeSelection:
      type: object
      description: |
        A site's theme selection. `selected: false` with revision 0 means no
        selection yet; the matching ETag is `"<siteId>-t0"`. The selection
        revision is independent of the site settings revision.
      required: [siteId, selected, theme, themeConfig, revision]
      properties:
        siteId:
          type: string
          format: uuid
        selected:
          type: boolean
        theme:
          type: object
          nullable: true
          description: The selected catalog entry identity; null when no selection exists yet.
          required: [themeId, version, manifestDigest]
          properties:
            themeId:
              type: string
            version:
              type: string
            manifestDigest:
              type: string
              pattern: '^[0-9a-f]{64}$'
        themeConfig:
          type: object
          nullable: true
          description: The saved configuration, already validated against the theme's schema; null when no selection exists yet.
        revision:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true

    SiteThemeSelectionPut:
      type: object
      description: |
        Selects a catalog entry by theme id and version. `themeConfig` is
        optional and defaults to `{}`; an explicit `null` is rejected — the
        configuration must be an object.
      required: [themeId, version]
      properties:
        themeId:
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        version:
          type: string
          description: SemVer 2.0.0 string.
        themeConfig:
          type: object
      additionalProperties: false

    CreationOptionsEnvelope:
      type: object
      description: Creation options response; the `publicKey` member is the PublicKeyCredentialCreationOptions consumed by `navigator.credentials.create()`.
      required: [publicKey]
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKeyCredentialCreationOptions'

    PublicKeyCredentialCreationOptions:
      type: object
      description: PublicKeyCredentialCreationOptions per WebAuthn Level 3.
      required: [challenge, rp, user, pubKeyCredParams, timeout, attestation]
      properties:
        challenge:
          type: string
          format: byte
          description: base64url challenge; single-use, ~5 min validity, enforced server-side.
        rp:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          required: [id, name, displayName]
          properties:
            id:
              type: string
              format: byte
              description: base64url user handle (random, opaque).
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            required: [type, alg]
            properties:
              type:
                type: string
                enum: [public-key]
              alg:
                type: integer
        timeout:
          type: integer
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
              enum: [required]
            requireResidentKey:
              type: boolean
              enum: [true]
            userVerification:
              type: string
              enum: [required]
        attestation:
          type: string
          enum: [none]

    AssertionOptionsEnvelope:
      type: object
      description: Assertion options response; the `publicKey` member is the PublicKeyCredentialRequestOptions consumed by `navigator.credentials.get()`.
      required: [publicKey]
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKeyCredentialRequestOptions'

    PublicKeyCredentialRequestOptions:
      type: object
      description: PublicKeyCredentialRequestOptions per WebAuthn Level 3; the empty allow list selects discoverable credentials.
      required: [challenge, rpId, timeout, userVerification]
      properties:
        challenge:
          type: string
          format: byte
        rpId:
          type: string
        timeout:
          type: integer
        userVerification:
          type: string
          enum: [required]

    CredentialCreationResponse:
      type: object
      description: PublicKeyCredential produced by `navigator.credentials.create()`, serialized with base64url fields.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
          format: byte
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              type: string
              format: byte
            attestationObject:
              type: string
              format: byte
            transports:
              type: array
              items:
                type: string
        clientExtensionResults:
          type: object

    CredentialAssertionResponse:
      type: object
      description: PublicKeyCredential produced by `navigator.credentials.get()`, serialized with base64url fields.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
          format: byte
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature, userHandle]
          properties:
            clientDataJSON:
              type: string
              format: byte
            authenticatorData:
              type: string
              format: byte
            signature:
              type: string
              format: byte
            userHandle:
              type: string
              format: byte
        clientExtensionResults:
          type: object
