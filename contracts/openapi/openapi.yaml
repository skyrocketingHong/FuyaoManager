        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Edge management is not configured (`edge_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/edge/reapply:
    post:
      operationId: reapplySiteEdge
      tags: [Sites]
      summary: Re-apply the managed entry configuration
      description: |
        Re-runs render + validate + reload for the managed snippet (all
        sites' entries, this one included) and reports the real outcome. The
        last good configuration keeps serving on failure. Owners and editors
        only.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '204':
          description: Applied successfully.
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The apply failed; the last good configuration keeps serving (`edge_apply_failed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Edge management is not configured (`edge_unavailable`), or the deployment switch is off (`deployment_disabled`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

