      summary: List the site's markdown posts
      description: |
        Paginated, searchable projection of the site's posts tree (one
        category nesting level, newest first). The `draft` flag mirrors the
        theme's public-output gate; drafts never reach the built site.
      security:
        - sessionCookie: []
