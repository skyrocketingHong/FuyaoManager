    put:
      operationId: setContentSources
      tags:
        - Sites
      summary: setContentSources
      responses:
        '200':
          description: Current resource state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSourceRecord'
        '403': *a1
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default: *a1
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - sources
              properties:
                sources:
                  $ref: '#/components/schemas/ContentSourceSelection'
                revision:
                  type: integer
                  format: int64
                  minimum: 0

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-fuyao-admin-session
      description: |
        HTTPS uses __Host-fuyao-admin-session: Secure, HttpOnly, SameSite=Lax,
        Path=/ and no Domain. Legacy names are not accepted on HTTPS and
        duplicate authentication cookies are rejected. Plain HTTP localhost
        uses fuyao_admin_session. Sessions are revoked and expire server-side.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: |
        CSRF token returned by the ceremony endpoints; stable for the
        lifetime of the session. Required, alongside an allowed Origin, on
        every authenticated mutating request.

  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PasskeyId:
      name: passkeyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
    AdminPageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    AdminSearch:
      name: q
      in: query
      description: Literal substring; LIKE metacharacters have no special meaning.
      schema: { type: string, maxLength: 128 }
    SiteId:
      name: siteId
      in: path
      required: true
      description: Site UUID.
      schema:
        type: string
        format: uuid
    BuildId:
      name: buildId
      in: path
      required: true
      description: Build task UUID.
      schema:
        type: string
        format: uuid
    ReleaseId:
      name: releaseId
      in: path
      required: true
      description: Release record UUID.
      schema:
        type: string
        format: uuid
    CSRFTokenHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF token bound to the session.
      schema:
        type: string
        minLength: 1
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The exact strong ETag of this site's settings as returned by GET
        settings (for example `"018f3c1e-...-r3"`). The ETag embeds the site
        UUID and the revision, so a tag from another site is rejected. The
        wildcard form `*` is not accepted: updates must not bypass optimistic
        locking. A missing header is rejected with 428; a foreign, malformed,
        or stale tag with 412/400 respectively.
      schema:
        type: string
        pattern: '^"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}-r[1-9][0-9]*"$'
        minLength: 1

  responses:
    PreconditionFailed:
      description: The exact revision ETag no longer matches (`precondition_failed`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CaddyState:
      description: Current configuration ownership, draft and exact revision ETag.
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CaddySite' }
    AdminUser:
      description: Saved account metadata.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminUser' }
    AccountCode:
      description: Account metadata and the once-returned code. Response is no-store.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AccountCode' }
    AccountConflict:
      description: Username conflict, inactive or terminal account, self-management, last administrator, last owner or last own passkey (`username_taken`, `account_conflict`, `self_management`, `last_admin`, `last_owner`, `last_passkey`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Problem:
      description: Unexpected error; the body never leaks SQL or connection details.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: The request requires an If-Match header (428).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: No or invalid session (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: CSRF token invalid (`csrf_token_invalid`), Origin rejected (`origin_rejected`), or insufficient role (`forbidden`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource does not exist or the caller has no membership (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidSiteId:
      description: The siteId path parameter is not a UUID (`invalid_site_id`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidPermit:
      description: Permit unknown, expired, used, or out of attempts (`invalid_permit`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RequestBodyTooLarge:
      description: Body exceeds 1 MiB (`request_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type must be application/json (`unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    CaddySite:
      type: object
      required:
        [siteId, sourceKey, kind, definition, present, syncedAt, managementMode, capabilities]
      properties:
        siteId: { type: string, format: uuid }
        sourceKey: { type: string }
        kind: { type: string, enum: [static, redirect, reverse_proxy, unsupported] }
        definition: { type: object, additionalProperties: true }
        present: { type: boolean }
        syncedAt: { type: string, format: date-time }
        managementMode: { type: string, enum: [platform, caddy] }
        management:
          oneOf:
            - $ref: '#/components/schemas/CaddyManagement'
            - enum: [null]
        capabilities:
          type: object
          required: [convert, edit, validate, deploy]
          properties:
            convert: { type: boolean }
            edit: { type: boolean }
            validate: { type: boolean }
            deploy: { type: boolean }
        unavailableReason: { type: string }
        settingsCapabilities:
          type: object
          required: [compression, cacheControl, securityHeaders]
          properties:
            compression: { type: boolean }
            cacheControl: { type: boolean }
            securityHeaders: { type: boolean }
    CaddySettings:
      type: object
      additionalProperties: false
      required: [compression, cacheControl, securityHeaders]
      properties:
        compression: { type: string, enum: [preserve, none, gzip, zstd, gzip_zstd] }
        cacheControl: { type: string, enum: [preserve, no_store] }
        securityHeaders: { type: string, enum: [preserve, baseline] }
    CaddyManagement:
      type: object
      required:
        [revision, appliedRevision, validatedRevision, sourceDigest, settings, history, updatedAt]
      properties:
        revision: { type: integer, format: int64 }
        appliedRevision: { type: integer, format: int64, nullable: true }
        validatedRevision: { type: integer, format: int64, nullable: true }
        sourceDigest: { type: string }
        settings: { $ref: '#/components/schemas/CaddySettings' }
        updatedAt: { type: string, format: date-time }
        history:
          type: array
          items:
            type: object
            required: [revision, settings, status, createdAt]
            properties:
              revision: { type: integer, format: int64 }
              settings: { $ref: '#/components/schemas/CaddySettings' }
              status: { type: string, enum: [draft, validated, applied] }
              createdAt: { type: string, format: date-time }
    AdminProfileInput:
      type: object
      additionalProperties: false
      required: [username, displayName]
      properties:
        username: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{2,63}$' }
        displayName: { type: string, maxLength: 200 }
    AdminUser:
      type: object
      required: [id, username, displayName, platformRole, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        platformRole: { type: string, enum: [admin, member] }
        status: { type: string, enum: [pending, active, disabled, deleted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [users, total, page, pageSize]
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    AccountCode:
      type: object
      required: [user, code, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        code: { type: string }
        expiresAt: { type: string, format: date-time }
    AdminUserDetail:
      type: object
      required: [user, access]
      properties:
        user: { $ref: '#/components/schemas/AdminUser' }
        access:
          type: object
          required: [sites, passkeys, sessions]
          properties:
            sites:
              type: array
              items:
                type: object
                required: [siteId, name, slug, role]
                properties:
                  siteId: { type: string, format: uuid }
                  name: { type: string }
                  slug: { type: string }
                  role: { type: string, enum: ['', owner, editor, viewer] }
            passkeys:
              type: array
              items:
                type: object
                required: [id, rpId, createdAt, lastUsedAt, backupEligible, backupState, currentRp]
                properties:
                  id: { type: string, format: uuid }
                  rpId: { type: string }
                  createdAt: { type: string, format: date-time }
                  lastUsedAt: { type: string, format: date-time, nullable: true }
                  backupEligible: { type: boolean }
                  backupState: { type: boolean }
                  currentRp: { type: boolean }
            sessions:
              type: array
              items:
                type: object
                required: [id, kind, createdAt, lastSeenAt, expiresAt, current]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string, enum: [full, restricted] }
                  createdAt: { type: string, format: date-time }
                  lastSeenAt: { type: string, format: date-time }
                  expiresAt: { type: string, format: date-time }
                  current: { type: boolean }
    AuditPage:
      type: object
      required: [entries, total, page, pageSize, operations]
      properties:
        entries:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        operations:
          type: array
          items: { type: string }
    AuditEvent:
      type: object
      required:
        [
          id,
          createdAt,
          actorId,
          actorName,
          operation,
          resourceId,
          siteId,
          method,
          route,
          peerIp,
          status,
          outcome
        ]
      properties:
        details:
          $ref: '#/components/schemas/AuditDetails'
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        actorId: { type: string, format: uuid, nullable: true }
        actorName: { type: string }
        operation: { type: string }
        resourceId: { type: string }
        siteId: { type: string, format: uuid, nullable: true }
        method: { type: string }
        route: { type: string }
        peerIp: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        outcome: { type: string, enum: [success, failure] }
    AuditDetails:
      type: object
      additionalProperties: false
      description: Canonical administrative change metadata. Older records have no details; secret values and request bodies are never accepted here.
      properties:
        targetUsername: { type: string, maxLength: 64 }
        field: { type: string, enum: [platformRole, status, siteRole] }
        before: { type: string }
        after: { type: string }
        sessionId: { type: string, format: uuid }
        passkeyId: { type: string, format: uuid }
    BuildFailure:
      type: object
      description: Persisted failure record of a build task.
      required: [stage, message]
      properties:
        stage:
          type: string
          description: The stage the task died in (capability-check, theme-lookup, theme-changed, theme-root, theme-source-changed, theme-manifest, workspace, snapshot, prepare, build, harvest, interrupted, internal).
        message:
          type: string
          description: Client-safe message; never contains server paths.
        missingCapabilities:
          type: array
          items: { type: string }
          description: Required capabilities the theme does not declare (capability-check stage only).
        missingUrlConventions:
          type: array
          items: { type: string }
          description: Required URL conventions the theme does not declare (capability-check stage only).
        exitCode:
          type: integer
          description: Process exit code when a command step failed.

    BuildTask:
      type: object
      description: |
        A persistent build-preview task. The identity block (theme, themeConfig,
        siteSettings, both revisions) is frozen at creation and is the only
        input the executor consumes. Filesystem locations are never exposed.
      required:
        [
          id,
          siteId,
          status,
          requestedBy,
          theme,
          themeConfig,
          siteSettings,
          siteSettingsRevision,
          themeSelectionRevision,
          createdAt,
          previewActive
        ]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        requestedBy: { type: string, format: uuid }
        theme:
          type: object
          required: [themeId, version, manifestDigest]
          properties:
            themeId: { type: string }
            version: { type: string }
            manifestDigest: { type: string }
        themeConfig:
          type: object
          description: The frozen theme configuration captured at creation.
        siteSettings:
          type: object
          description: The frozen public site settings snapshot captured at creation.
          required: [site]
          properties:
            site:
              type: object
              required: [name, description, defaultLocale]
              properties:
                name: { type: string }
                description: { type: string }
                defaultLocale: { type: string }
        siteSettingsRevision: { type: integer, format: int64 }
        themeSelectionRevision: { type: integer, format: int64 }
        failure:
          oneOf:
            - $ref: '#/components/schemas/BuildFailure'
            - enum: [null]
          description: Present (non-null) only for `failed` tasks; null while queued, running, or succeeded.
        inputDigests:
          type: object
          nullable: true
          required: [contentDigest, siteConfigDigest, themeConfigDigest]
          additionalProperties: false
          properties:
            contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            siteConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            themeConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          description: |
            The three input digests recorded by the theme preparation flow:
            `contentDigest`, `siteConfigDigest`, and `themeConfigDigest`
            SHA-256 strings. Present only for `succeeded` tasks; null while
            queued, running, or failed.
        sourceDigest:
          type: string
          nullable: true
          description: Aggregate SHA-256 over the task's private source copy (every copied file's path and digest, sorted) once the copy is materialized; broader than the manifest digest, which covers theme.json only.
        sourceFileCount:
          type: integer
          nullable: true
          description: Number of source files the task's private copy recorded.
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        previewActive:
          type: boolean
          description: |
            Whether the server process currently serves this build's private
            preview origin with an unexpired token (live in-process state,
            never a persisted or port-based flag). Always false until a
            preview link is issued and again after the preview is closed,
            expires, or the server restarts.

    PreviewLink:
      type: object
      description: A short-lived private preview URL on a per-build loopback origin.
      required: [url, expiresAt]
      properties:
        url:
          type: string
          description: Entry URL carrying a one-time token exchanged for an HttpOnly cookie on the preview origin.
        expiresAt: { type: string, format: date-time }

    ReleaseCreate:
      type: object
      description: Publish request body.
      required: [buildId]
      properties:
        buildId:
          type: string
          format: uuid
          description: The succeeded build whose artifacts become the release.
        reasons:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            enum: [manual, posts, albums, data, favicon, static]
          description: Why the release is produced (mirrored into release.json); omitted defaults to [manual].
      additionalProperties: false

    ReleaseFailure:
      type: object
      description: Persisted failure record of a publish attempt.
      required: [stage, message]
      properties:
        stage:
          type: string
          description: The stage the publish died in (capability-check, artifacts, workspace, release-metadata, persist).
        message:
          type: string
          description: Client-safe message; never contains server paths.
        missingCapabilities:
          type: array
          items: { type: string }
          description: Required capabilities the theme does not declare (capability-check stage only).
        missingUrlConventions:
          type: array
          items: { type: string }
          description: Required URL conventions the theme does not declare (capability-check stage only).
        missingArtifacts:
          type: array
          items: { type: string }
          description: Theme-declared requiredArtifacts missing from the build output (artifacts stage only).

    Release:
      type: object
      description: |
        A persisted release record. One release per build; the live one is
        what the published origin serves. The theme identity and input
        digests identify the exact content/theme/configuration triple, which
        is what rollback restores. Filesystem locations are never exposed.
      required:
        [id, siteId, buildId, status, theme, inputDigests, routes, reasons, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        siteId: { type: string, format: uuid }
        buildId:
          type: string
          format: uuid
          description: The succeeded build whose sealed artifacts back this release.
        theme:
          type: object
          required: [themeId, version, manifestDigest]
          properties:
            themeId: { type: string }
            version: { type: string }
            manifestDigest: { type: string }
        inputDigests:
          type: object
          nullable: true
          required: [contentDigest, siteConfigDigest, themeConfigDigest]
          additionalProperties: false
          properties:
            contentDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            siteConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
            themeConfigDigest: { type: string, pattern: '^sha256:[0-9a-f]{64}$' }
          description: |
            The three input digests the release was built from
            (`contentDigest`, `siteConfigDigest`, `themeConfigDigest`
            SHA-256 strings). A release always backs a succeeded build, so
            the object carries all three fields; null only as a defensive
            state when no digest could be carried.
        routes:
          type: object
          required: [spaFallback, urlConventions]
          properties:
            spaFallback:
              type: string
              nullable: true
              description: The SPA fallback file mirrored from the theme manifest (null when the theme declares none).
            urlConventions:
              type: array
              items: { type: string }
        reasons:
          type: array
          items:
            enum: [manual, posts, albums, data, favicon, static]
        status:
          type: string
          enum: [live, superseded, failed]
        failure:
          oneOf:
            - $ref: '#/components/schemas/ReleaseFailure'
            - enum: [null]
          description: Present (non-null) only for `failed` attempts; null otherwise.
        createdBy: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        activatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the release last became live.
        supersededAt:
          type: string
          format: date-time
          nullable: true
          description: When a newer publish or rollback replaced this release.

    Problem:
      type: object
      description: RFC 9457 error document with a stable machine-readable code.
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: One of unauthenticated, csrf_token_invalid, origin_rejected, forbidden, not_found, invalid_site_id, invalid_permit, permit_used, permit_expired, bootstrap_closed, challenge_invalid, credential_rejected, validation_error, invalid_json, invalid_if_match, precondition_required, precondition_failed, request_too_large, unsupported_media_type, theme_not_found, invalid_theme_config, theme_contracts_unavailable, no_theme_selected, build_not_found, build_not_succeeded, build_runner_unavailable, preview_unavailable, publish_unavailable, deployment_disabled, username_taken, build_not_publishable, release_build_conflict, release_not_found, release_not_rollbackable, no_live_release, invalid_id, internal_error.
          enum:
            - unauthenticated
            - preview_closed
            - caddy_unavailable
            - caddy_invalid
            - catalog_unavailable
            - site_kind_mismatch
            - last_admin
            - last_owner
            - last_passkey
            - self_management
            - account_conflict
            - csrf_token_invalid
            - origin_rejected
            - forbidden
            - not_found
            - invalid_site_id
            - invalid_permit
            - permit_used
            - permit_expired
            - bootstrap_closed
            - challenge_invalid
            - credential_rejected
            - validation_error
            - invalid_json
            - invalid_if_match
            - precondition_required
            - precondition_failed
            - request_too_large
            - unsupported_media_type
            - theme_not_found
            - invalid_theme_config
            - theme_contracts_unavailable
            - no_theme_selected
            - invalid_id
            - preview_unavailable
            - build_runner_unavailable
            - build_not_succeeded
            - build_not_found
            - publish_unavailable
            - deployment_disabled
            - build_not_publishable
            - release_build_conflict
            - release_not_found
            - release_not_rollbackable
            - no_live_release
            - invalid_code
            - username_taken
            - code_used
            - code_expired
            - code_locked
            - code_purpose_mismatch
            - rate_limited
            - slug_taken
            - provisioning_unavailable
            - passkey_unavailable
            - edge_apply_failed
            - content_unavailable
            - content_exists
            - invalid_content_path
            - photo_in_use
            - reference_scan_failed
            - edge_unavailable
            - deployment_disabled
            - username_taken
            - internal_error
        detail:
          type: string

    AccountProfileUpdate:
      type: object
      description: The full body of PATCH /api/v1/account/profile — the target is always the caller's own account.
      required: [username]
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
          description: The new username; mirrors the database CHECK constraint and UNIQUE index.

    User:
      type: object
      required: [id, username, displayName, platformRole]
      properties:
        platformRole:
          type: string
          enum: [admin, member]
        id:
          type: string
          format: uuid
        username:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{2,63}$'
        displayName:
          type: string
          maxLength: 200

    CeremonyDone:
      type: object
      description: Successful enrollment, login, binding, or code redemption; the CSRF token is stable for the whole session and must be echoed on mutating requests.
      required: [user, csrfToken, sessionScope, passkeyBound]
      properties:
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
        sessionScope:
          type: string
          enum: [full, restricted]
          description: |
            Business admission of the freshly minted session. `restricted`
            means the code confirmed the account identity but the account
            owns no credential for the current relying party yet: the session
            may only read the auth state, complete the passkey-binding
            ceremony, and log out.
        passkeyBound:
          type: boolean
          description: Whether the account owns a credential registered under the current relying-party ID.

    SessionInfo:
      type: object
      required: [authenticated, platformInitialized, passkeyBound, passkeyAvailable]
      properties:
        authenticated:
          type: boolean
        platformInitialized:
          type: boolean
          description: Whether the CLI first-run binding already happened; false tells an anonymous browser to show the initialization guidance.
        user:
          $ref: '#/components/schemas/User'
        csrfToken:
          type: string
        sessionScope:
          type: string
          enum: [full, restricted]
          description: Present only when authenticated; business APIs require `full`.
        passkeyBound:
          type: boolean
          description: Whether the session's account owns a credential registered under the current relying-party ID.
        passkeyAvailable:
          type: boolean
          description: Whether this deployment's relying party can serve WebAuthn ceremonies at all (false on IP-literal configurations).

    AuthCodeExchangeRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^[A-Z2-7]{4}(-[A-Z2-7]{4}){3}$'
          description: Single-use code printed by `fuyao-admin init-admin` (first administrator) or `fuyao-admin login-code` (every login).
      additionalProperties: false

    EnrollmentPermitRequest:
      type: object
      required: [permit]
      properties:
        permit:
          type: string
          pattern: '^[A-Z2-7]{4}(-[A-Z2-7]{4}){3}$'
          description: Single-use permit code printed by `fuyao-admin bootstrap-admin`.
      additionalProperties: false

    SiteCreate:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
          default: zh-CN
        visibility:
          type: string
          enum: [public, private]
          default: private
        themeId:
          type: string
          description: Optional initial theme selection; requires themeVersion.
        themeVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
        themeConfig:
          type: object
          description: Optional theme configuration validated against the theme's config schema.
      additionalProperties: false

    Post:
      type: object
      description: The editable projection of one markdown post; frontmatter fields mirror exactly what the theme's index generator consumes. `draft` is the public-output gate.
      required: [path, category, title, slug, date, draft, digest]
      properties:
        path:
          type: string
          description: '`category/slug.md` relative to the posts root.'
        category:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        title:
          type: string
          minLength: 1
          maxLength: 300
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,120}$'
        date:
          type: string
          description: |
            Post date. Accepted shapes: `YYYY-MM-DD`, `YYYY-MM-DDTHH:mm`,
            with optional seconds and fractional seconds, and any of those
            with a `Z` or `±HH:mm` offset (date-only values take no offset).
            Impossible calendar dates, hours, minutes, seconds, or offsets
            are rejected instead of rolled over; offsets range within
            `±23:59` at most (hours 00-23, minutes 00-59). Values without an
            offset sort as UTC; the submitted string is stored verbatim and
            never rewritten.
        lastmod:
          type: string
          description: |
            Optional last-modified stamp using the same shapes and
            semantics as `date`. An empty value clears the stored stamp;
            a non-empty value is stored verbatim.
        draft:
          type: boolean
        categories:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        description:
          type: string
          maxLength: 500
        cover:
          type: string
        coverAlt:
          type: string
        coverSource:
          type: string
        coverSourceLink:
          type: string
        body:
          type: string
          description: Markdown body (frontmatter excluded).
        digest:
          type: string
          description: '`sha256:<hex>` content digest backing the ETag.'

    PostDirectory:
      type: object
      required: [slug, title, postCount]
      properties:
        slug:
          type: string
        title:
          type: string
        postCount:
          type: integer
    TaxonomyTerm:
      type: object
      required: [name, postCount]
      properties:
        name:
          type: string
        postCount:
          type: integer
    PostTaxonomy:
      type: object
      required: [directories, categories, tags, postCount, canEdit]
      properties:
        directories:
          type: array
          items:
            $ref: '#/components/schemas/PostDirectory'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TaxonomyTerm'
        postCount:
          type: integer
        canEdit:
          type: boolean
    PostList:
      type: object
      required: [posts, total]
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
        total:
          type: integer

    Friend:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
        url:
          type: string
        description:
          type: string
          maxLength: 200
        avatar:
          type: string

    FriendsEnvelope:
      type: object
      required: [friends, digest]
      properties:
        friends:
          type: object
          required: [online, offline]
          properties:
            online:
              type: array
              items:
                $ref: '#/components/schemas/Friend'
            offline:
              type: array
              items:
                $ref: '#/components/schemas/Friend'
        digest:
          type: string

    SocialLink:
      type: object
      required: [name, href]
      properties:
        name:
          type: string
        href:
          type: string
        icon:
          type: string

    SocialLinksEnvelope:
      type: object
      required: [links, digest]
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/SocialLink'
        digest:
          type: string

    SiteEdgeState:
      type: object
      required: [site, enabled, isolated, inSync]
      properties:
        site:
          type: object
          required: [currentOk]
          properties:
            siteId: { type: string }
            slug: { type: string }
            visibility: { type: string, enum: [public, private] }
            port: { type: integer }
            originUrl: { type: string }
            releaseDir:
              type: string
              description: Server-side fact; always empty in API responses and kept only for contract compatibility.
            currentOk:
              type: boolean
              description: The on-disk current pointer matches the database's live release. A reserved port or a rendered URL never implies this; while isolated, it stays false.
        enabled:
          type: boolean
          description: Snippet management is configured (operator-approved snippet directory present).
        isolated:
          type: boolean
          description: Run isolation — the deployment switch is off, so no publish server exists and the edge is never reconciled or applied; ports and URLs are reservations only.
        inSync:
          type: boolean
          description: The managed snippet on disk matches the desired render.
        lastAppliedAt:
          type: string
        lastError:
          type: string
        snippetPath:
          type: string
          description: Operator-configured managed snippet path (server-side fact).
        privateBind:
          type: string
        publicHost:
          type: string

    SiteConfigEnvelope:
      type: object
      required: [config, digest]
      properties:
        config:
          $ref: '#/components/schemas/SiteConfig'
        amapSecurityCodeSet:
          type: boolean
        effectiveOrigin:
          type: string
          description: The site's real managed entry (http://host:port); empty before the entry exists. Visibility switches change this host and require a rebuild to re-emit canonical/RSS/Sitemap URLs.
        digest:
          type: string
        secrets:
          type: object
          description: Write-only secret channel; never present in responses.
          properties:
            amap:
              type: object
              properties:
                securityCode:
                  type: string
                  writeOnly: true

    SiteConfig:
      type: object
      description: The site.yaml projection the theme consumes (schema.ts); the AMap security code is write-only through the secrets channel.
      required: [site, profile, repository, seo, services]
      properties:
        schemaVersion:
          type: integer
        site:
          type: object
          required: [name, url, defaultLocale]
          properties:
            name: { type: string }
            url: { type: string }
            startDate: { type: string }
            startYear: { type: integer }
            defaultLocale:
              type: string
              enum: [zh-CN, en-US]
        profile:
          type: object
          required: [name, avatarUrl]
          properties:
            name: { type: string }
            birthDate: { type: string }
            avatarUrl: { type: string }
            roles:
              type: object
              properties:
                zh-CN: { type: string }
                en-US: { type: string }
            quotes:
              type: object
              properties:
                zh-CN: { type: string }
                en-US: { type: string }
        repository:
          type: object
          required: [name, url, owner]
          properties:
            name: { type: string }
            url: { type: string }
            owner: { type: string }
        seo:
          type: object
          required: [author, description]
          properties:
            author: { type: string }
            description: { type: string }
            keywords:
              type: array
              items: { type: string }
            twitterId: { type: string }
        services:
          type: object
          properties:
            wallpaper:
              type: object
              required: [defaultUrl]
              properties:
                defaultUrl: { type: string }
                apiUrl: { type: string }
                metadataApiUrl: { type: string }
            amap:
              type: object
              description: securityCode is write-only via the envelope's secrets channel.
              properties:
                browserKey: { type: string }
                serviceHost: { type: string }
            githubProxyUrl: { type: string }
            analyticsProxyUrl: { type: string }
            codingActivityProxyUrl: { type: string }
            codingLanguagesProxyUrl:
              type: string

    AlbumIndexEnvelope:
      type: object
      required: [index, digest]
      properties:
        index:
          type: object
          required: [schemaVersion, totalPhotos, years, devices]
          properties:
            schemaVersion: { type: integer }
            generatedAt: { type: string }
            totalPhotos: { type: integer }
            years:
              type: array
              items: { type: string }
            devices:
              type: array
        digest: { type: string }

    AlbumUploadAccepted:
      type: object
      required: [taskId]
      properties:
        path:
          type: string
          description: Stored original path (yyyy/mm/dd/name.ext); present for uploads.
        taskId:
          type: string

    MediaTask:
      type: object
      required: [id, kind, status, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [album-index] }
        status: { type: string, enum: [queued, running, succeeded, failed] }
        failure:
          type: object
          properties:
            stage: { type: string }
            message: { type: string }
        createdAt: { type: string }
        finishedAt: { type: string }

    MediaTaskList:
      type: object
      required: [tasks]
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/MediaTask'

    AlbumPhotoEntry:
      type: object
      required: [filename, path]
      properties:
        filename: { type: string }
        path: { type: string }
        date: { type: string }
        coordType: { type: string }
        make: { type: string }
        model: { type: string }
        width: { type: integer }
        height: { type: integer }
        variants:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              width: { type: integer }
              height: { type: integer }
              type: { type: string }
        title: { type: string }
        description: { type: string }
        alt: { type: string }

    AlbumYearEnvelope:
      type: object
      required: [year, digest]
      properties:
        year:
          type: object
          required: [year, photos]
          properties:
            year: { type: integer }
            title:
              type: string
              description: Managed album title (indexer-preserved; empty falls back to the year).
            cover:
              type: string
              description: Managed cover photo filename of this year (empty falls back to the first thumbnail).
            photos:
              type: array
              items:
                $ref: '#/components/schemas/AlbumPhotoEntry'
        digest: { type: string }

    FootprintName:
      type: object
      required: [zh, en]
      properties:
        zh: { type: string }
        en: { type: string }

    FootprintCoordinates:
      type: object
      required: [lng, lat]
      properties:
        lng: { type: number }
        lat: { type: number }

    FootprintPlace:
      type: object
      required: [id, name, coordinates, type, visitDate]
      properties:
        id: { type: string }
        name:
          $ref: '#/components/schemas/FootprintName'
        coordinates:
          $ref: '#/components/schemas/FootprintCoordinates'
        type: { type: string, enum: [spot] }
        visitDate: { type: string, pattern: '^\\d{8}$' }
        description: { type: string }

    FootprintCity:
      type: object
      required: [id, name, coordinates, type, visitDate]
      properties:
        id: { type: string }
        name:
          $ref: '#/components/schemas/FootprintName'
        coordinates:
          $ref: '#/components/schemas/FootprintCoordinates'
        type: { type: string, enum: [city] }
        adcode: { type: string }
        visitDate: { type: string, pattern: '^\\d{8}$' }
        description: { type: string }
        places:
          type: array
          items:
            $ref: '#/components/schemas/FootprintPlace'

    FootprintsEnvelope:
      type: object
      required: [footprints, digest]
      properties:
        footprints:
          type: object
          required: [cities]
          properties:
            cities:
              type: array
              items:
                $ref: '#/components/schemas/FootprintCity'
        digest: { type: string }

    Site:
      type: object
      required:
        [
          siteId,
          slug,
          name,
          description,
          defaultLocale,
          visibility,
          provisionState,
          role,
          settingsRevision,
          createdAt,
          updatedAt
        ]
      properties:
        managementMode:
          type: string
          enum: [platform, caddy]
          description: Configuration ownership; separate from the content kind.
        kind:
          type: string
          enum: [theme, static, redirect, reverse_proxy, unsupported]
          description: Determines the available workspace; legacy omitted values mean theme.
        siteId:
          type: string
          format: uuid
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{0,62}$'
        visibility:
          type: string
          enum: [public, private]
        provisionState:
          type: string
          enum: [provisioning, ready, failed]
        provisionFailure:
          type: object
          description: Present only when provisionState is failed; names the stage that broke.
          properties:
            stage:
              type: string
            message:
              type: string
        name:
          type: string
        description:
          type: string
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
        role:
          type: string
          enum: [owner, editor, viewer]
          description: The caller's role in this site.
        settingsRevision:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        workspace:
          $ref: '#/components/schemas/SiteWorkspace'

    SiteList:
      type: object
      required: [sites]
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'

    SiteSettings:
      type: object
      required: [siteId, name, description, defaultLocale, revision, updatedAt]
      properties:
        siteId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
        revision:
          type: integer
          format: int64
          minimum: 1
        updatedAt:
          type: string
          format: date-time

    SiteSettingsPatch:
      type: object
      description: At least one field must be present; name is trimmed before validation.
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 1000
        defaultLocale:
          type: string
          enum: [zh-CN, en-US]
      additionalProperties: false

    Theme:
      type: object
      description: |
        One registered (theme id, version) catalog entry. Registered by the
        operator-driven `fuyao-admin register-theme` CLI after full contract
        validation; the manifest digest distinguishes the exact theme.json
        bytes behind the entry. Server-side source paths are never exposed.
      required:
        [
          id,
          themeId,
          version,
          adapter,
          inputProtocol,
          capabilities,
          outputs,
          configSchema,
          manifestDigest,
          registeredAt,
          updatedAt
        ]
      properties:
        id:
          type: string
          format: uuid
          description: Catalog row id.
        themeId:
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        version:
          type: string
          description: SemVer 2.0.0 theme version.
        name:
          type: string
        description:
          type: string
        adapter:
          type: string
          description: Trusted build adapter this theme requires (currently `node22-sveltekit-static`).
        inputProtocol:
          type: string
          description: Build-input snapshot protocol the theme consumes (`fuyao.theme.build-input/v1`).
        capabilities:
          type: array
          items:
            type: string
            enum: [blog, albums, footprint, friends, pay, favicon]
          description: Content capabilities the theme declares.
        outputs:
          type: object
          required: [spaFallback, urlConventions, requiredArtifacts]
          properties:
            spaFallback:
              type: string
              nullable: true
              description: SPA fallback page inside a release, or null when every route is prerendered.
            urlConventions:
              type: array
              items:
                type: string
                enum: [release.json, posts, data, media-albums, sitemap, blog-rss, blog-search]
            requiredArtifacts:
              type: array
              items:
                type: string
        configSchema:
          type: object
          nullable: true
          description: The theme's own JSON Schema (draft 2020-12) document the per-site themeConfig must satisfy; null when the theme declares none (only `{}` is valid).
        manifestDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Hex SHA-256 digest of the exact theme.json bytes registered.
        registeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ThemeList:
      type: object
      required: [themes]
      properties:
        themes:
          type: array
          items:
            $ref: '#/components/schemas/Theme'

    SiteThemeSelection:
      type: object
      description: |
        A site's theme selection. `selected: false` with revision 0 means no
        selection yet; the matching ETag is `"<siteId>-t0"`. The selection
        revision is independent of the site settings revision.
      required: [siteId, selected, theme, themeConfig, revision]
      properties:
        siteId:
          type: string
          format: uuid
        selected:
          type: boolean
        theme:
          type: object
          nullable: true
          description: The selected catalog entry identity; null when no selection exists yet.
          required: [themeId, version, manifestDigest]
          properties:
            themeId:
              type: string
            version:
              type: string
            manifestDigest:
              type: string
              pattern: '^[0-9a-f]{64}$'
        themeConfig:
          type: object
          nullable: true
          description: The saved configuration, already validated against the theme's schema; null when no selection exists yet.
        revision:
          type: integer
          format: int64
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true

    SiteThemeSelectionPut:
      type: object
      description: |
        Selects a catalog entry by theme id and version. `themeConfig` is
        optional and defaults to `{}`; an explicit `null` is rejected — the
        configuration must be an object.
      required: [themeId, version]
      properties:
        themeId:
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        version:
          type: string
          description: SemVer 2.0.0 string.
        themeConfig:
          type: object
      additionalProperties: false

    CreationOptionsEnvelope:
      type: object
      description: Creation options response; the `publicKey` member is the PublicKeyCredentialCreationOptions consumed by `navigator.credentials.create()`.
      required: [publicKey]
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKeyCredentialCreationOptions'

    PublicKeyCredentialCreationOptions:
      type: object
      description: PublicKeyCredentialCreationOptions per WebAuthn Level 3.
      required: [challenge, rp, user, pubKeyCredParams, timeout, attestation]
      properties:
        challenge:
          type: string
          format: byte
          description: base64url challenge; single-use, ~5 min validity, enforced server-side.
        rp:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        user:
          type: object
          required: [id, name, displayName]
          properties:
            id:
              type: string
              format: byte
              description: base64url user handle (random, opaque).
            name:
              type: string
            displayName:
              type: string
        pubKeyCredParams:
          type: array
          items:
            type: object
            required: [type, alg]
            properties:
              type:
                type: string
                enum: [public-key]
              alg:
                type: integer
        timeout:
          type: integer
        authenticatorSelection:
          type: object
          properties:
            residentKey:
              type: string
              enum: [required]
            requireResidentKey:
              type: boolean
              enum: [true]
            userVerification:
              type: string
              enum: [required]
        attestation:
          type: string
          enum: [none]

    AssertionOptionsEnvelope:
      type: object
      description: Assertion options response; the `publicKey` member is the PublicKeyCredentialRequestOptions consumed by `navigator.credentials.get()`.
      required: [publicKey]
      properties:
        publicKey:
          $ref: '#/components/schemas/PublicKeyCredentialRequestOptions'

    PublicKeyCredentialRequestOptions:
      type: object
      description: PublicKeyCredentialRequestOptions per WebAuthn Level 3; the empty allow list selects discoverable credentials.
      required: [challenge, rpId, timeout, userVerification]
      properties:
        challenge:
          type: string
          format: byte
        rpId:
          type: string
        timeout:
          type: integer
        userVerification:
          type: string
          enum: [required]

    CredentialCreationResponse:
      type: object
      description: PublicKeyCredential produced by `navigator.credentials.create()`, serialized with base64url fields.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
          format: byte
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          required: [clientDataJSON, attestationObject]
          properties:
            clientDataJSON:
              type: string
              format: byte
            attestationObject:
              type: string
              format: byte
            transports:
              type: array
              items:
                type: string
        clientExtensionResults:
          type: object

    CredentialAssertionResponse:
      type: object
      description: PublicKeyCredential produced by `navigator.credentials.get()`, serialized with base64url fields.
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
          format: byte
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          required: [clientDataJSON, authenticatorData, signature, userHandle]
          properties:
            clientDataJSON:
              type: string
              format: byte
            authenticatorData:
              type: string
              format: byte
            signature:
              type: string
              format: byte
            userHandle:
              type: string
              format: byte
        clientExtensionResults:
          type: object
    ContentSourceSelection:
      type: object
      additionalProperties: false
      required:
        - posts
        - albums
        - footprints
        - friends
      properties:
        posts:
          type: string
          enum:
            - platform
            - independent
        albums:
          type: string
          enum:
            - platform
            - independent
        footprints:
          type: string
          enum:
            - platform
            - independent
        friends:
          type: string
          enum:
            - platform
            - independent
    ContentSourceRecord:
      type: object
      required:
        - sources
        - revision
      properties:
        sources:
          $ref: '#/components/schemas/ContentSourceSelection'
        revision:
          type: integer
          format: int64
          minimum: 0
    ContentCounts:
      type: object
      required:
        - posts
        - albums
        - photos
        - places
        - friends
      properties:
        posts:
          type: integer
          minimum: 0
        albums:
          type: integer
          minimum: 0
        photos:
          type: integer
          minimum: 0
        places:
          type: integer
          minimum: 0
        friends:
          type: integer
          minimum: 0
    SiteWorkspace:
      type: object
      required:
        - themeEnabled
        - themeSelectable
        - buildable
        - deployable
        - hasCaddy
      properties:
        themeEnabled:
          type: boolean
        themeSelectable:
          type: boolean
        buildable:
          type: boolean
        deployable:
          type: boolean
        hasCaddy:
          type: boolean
    PlatformContent:
      type: object
      required:
        - canEdit
        - counts
        - amap
      properties:
        canEdit:
          type: boolean
        counts:
          $ref: '#/components/schemas/ContentCounts'
        amap:
          type: object
          properties:
            browserKey:
              type: string
            serviceHost:
              type: string
    SiteOverview:
      type: object
      required:
        - counts
        - sources
        - theme
        - hasCaddy
        - workspace
        - analytics
      properties:
        counts:
          $ref: '#/components/schemas/ContentCounts'
        sources:
          $ref: '#/components/schemas/ContentSourceSelection'
        theme:
          $ref: '#/components/schemas/SiteThemeSelection'
        hasCaddy:
          type: boolean
        workspace:
          $ref: '#/components/schemas/SiteWorkspace'
        analytics:
          $ref: '#/components/schemas/TrafficSnapshot'
    TrafficDaily:
      type: object
      required:
        - date
        - pageViews
        - requests
        - uniques
      properties:
        date:
          type: string
          format: date
        pageViews:
          type: integer
          format: int64
          minimum: 0
        requests:
          type: integer
          format: int64
          minimum: 0
        uniques:
          type: integer
          format: int64
          minimum: 0
    TrafficSnapshot:
      type: object
      required:
        - configured
        - available
        - provider
        - cache
        - latest
      properties:
        configured:
          type: boolean
        available:
          type: boolean
        provider:
          type: string
          enum:
            - cloudflare
        cache:
          type: string
          enum:
            - fresh
            - stale
            - unknown
        latest:
          oneOf:
            - $ref: '#/components/schemas/TrafficDaily'
            - enum:
                - null
