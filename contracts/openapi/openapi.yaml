          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '204':
          description: Post deleted.
        '400':
          description: Malformed path or If-Match (`invalid_content_path`, `invalid_if_match`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
