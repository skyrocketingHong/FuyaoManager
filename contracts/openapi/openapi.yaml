  /api/v1/sites/{siteId}/albums/{year}/{filename}:
    delete:
      operationId: deleteAlbumPhoto
      tags: [Content]
      summary: Delete one photo
      description: |
        Hard delete (default): removes the original, every thumbnail, and the
        metadata entry after verifying the digest ETag and proving that no
        live or rollback-able release's frozen metadata still references the
        photo (`photo_in_use` otherwise; a failed or unreadable reference
        scan refuses the deletion with `reference_scan_failed`). Detach mode
        (`?mode=detach`): removes the metadata entry only, so the next build
        excludes the photo from public output while the files stay on disk
        for releases that still reference them.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: year
          in: path
          required: true
          schema: { type: string, pattern: '^\d{4}$' }
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema:
            type: string
            enum: [delete, detach]
            default: delete
          description: '`delete` removes files and metadata (reference-checked); `detach` removes the metadata entry only.'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '204':
          description: Photo deleted (or detached).
        '400':
          description: Malformed request (`invalid_if_match`, `invalid_content_path`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: The release reference scan failed; deletion is refused (`reference_scan_failed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The photo is still referenced by a live or rollback-able release (`photo_in_use`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The document changed after it was read (`precondition_failed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          description: The content store is not configured (`content_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

