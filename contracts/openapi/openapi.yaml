openapi: 3.0.3
info:
  title: FuyaoManager Management API
  version: 0.1.0
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
  description: |
    Management API of FuyaoManager, the site and content management platform.

    Scope of this contract (and of the implementation it describes):

    - Passkey authentication (WebAuthn discoverable credentials, user
      verification required) is the routine sign-in. There is no password,
      bearer token, or development-admin login. A CLI-issued one-time code
      (`fuyao-admin init-admin`, `fuyao-admin login-code`) proves the account
      identity for the first bind and stays the operator-approved recovery
      entry; an account without a credential for the current relying party
      holds only a short-lived restricted registration session until it
      completes the session-bound passkey-binding ceremony.
    - First-run bootstrap: the legacy local `fuyao-admin bootstrap-admin`
      permit flow still enrolls exactly the first administrator and closes
      afterwards; all later registrations go through the session-bound
      binding endpoints.
    - Cookie sessions with server-side revocation, CSRF token enforcement, and
      strict Origin checking on unsafe methods.
    - Site list, site detail, and site settings with strong ETags and
      mandatory If-Match on updates.
    - Theme catalog reading and per-site theme selection with configuration
      persisted against each theme's own configuration schema. Themes are
      registered by the operator-driven `fuyao-admin register-theme` CLI;
      the HTTP surface never accepts file paths, shell commands, or Git
      addresses, and the catalog never exposes server-side source paths.
    - Persistent build-preview tasks: creation freezes the site settings and
      theme selection version view, the executor runs the trusted adapter
      sequence against the registered theme source, and succeeded builds get
      short-lived private preview links on per-build loopback origins.
      Filesystem locations and executor internals are never exposed.

    Not implemented in this package (and therefore not described here):
    Tailscale private-network exposure, the 30-minute public gate, articles,
    pages, modules, multi-site fan-out, key/source build operations, and the
    admin front end.

    The server binds loopback only. The default development origin is
    http://localhost:5174 with relying-party ID `localhost`.
servers:
  - url: http://localhost:8787
    description: Local development server (loopback binding only)

tags:
  - name: Auth
    description: WebAuthn enrollment and login ceremonies.
  - name: Account
    description: Self-service account profile for the caller's own account.
  - name: Administration
    description: Administrator-only account lifecycle, site access and credential management.
  - name: Audit
    description: Administrator-only structured operation and authentication history.
  - name: Session
    description: Session introspection and logout.
  - name: Sites
    description: Site listing, detail, and settings.
  - name: Themes
    description: Theme catalog and per-site theme selection.
  - name: Builds
    description: Build-preview tasks and private preview links.
  - name: Releases
    description: Publishing, release history, and rollback.
  - name: Platform content
    description: Shared blogs, albums, places and friends, independent of websites.

security:
  - sessionCookie: []

paths:
  /{previewHost}/{path...}:
    get:
      operationId: getPreviewWrapper
      tags: [Builds]
      summary: Open an isolated preview lease on the preview hostname
      description: Only served on the configured preview hostname. The first segment is the formal website hostname. The lease is issued after management authentication and site-membership validation, expires and is revoked on close. This request never creates or reopens an origin.
      security: []
      parameters:
        - name: previewHost
          in: path
          required: true
          schema: { type: string }
        - name: path...
          in: path
          required: true
          schema: { type: string }
        - name: lease
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The controlled preview frame wrapper.
          content:
            text/html:
              schema: { type: string }
        '404': { description: 'Wrong host, path, or unknown lease.' }
        '410': { description: The preview lease has been closed or expired. }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/openapi:
    get:
      operationId: getOpenAPI
      tags: [Administration]
      summary: Read the platform OpenAPI document
      responses:
        '200':
          description: The authoritative OpenAPI document as JSON.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/caddy/sync:
    post:
      operationId: syncCaddySites
      tags: [Administration]
      summary: Synchronize the real Caddy inventory through a fixed read-only helper
      x-required-platform-role: admin
      description: Does not rewrite Caddyfile or grant root access. Existing complex configuration is retained and exposed read-only. Manager control-plane routes are excluded.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Number of imported or refreshed real site records.
          content:
            application/json:
              schema:
                type: object
                required: [imported]
                properties:
                  imported: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sites/{siteId}/caddy:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    get:
      operationId: getCaddySite
      tags: [Sites]
      summary: Read the imported Caddy configuration for a member site
      responses:
        '200':
          description: Sanitized configuration metadata, never arbitrary Caddy JSON.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaddySite' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sites/{siteId}/caddy/convert:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: convertCaddySite
      tags: [Sites]
      summary: Adopt an operator-approved source configuration without changing live traffic
      x-required-platform-role: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/CaddyState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sites/{siteId}/caddy/draft:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    put:
      operationId: saveCaddyDraft
      tags: [Sites]
      summary: Save a bounded configuration draft without applying it
      x-required-platform-role: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [settings]
              properties:
                settings: { $ref: '#/components/schemas/CaddySettings' }
      responses:
        '200': { $ref: '#/components/responses/CaddyState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sites/{siteId}/caddy/validate:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: validateCaddyDraft
      tags: [Sites]
      summary: Validate the exact saved revision through the fixed source capability
      x-required-platform-role: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/CaddyState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sites/{siteId}/caddy/deploy:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: deployCaddyDraft
      tags: [Sites]
      summary: Apply an approved validated revision and restore the last good file on failure
      x-required-platform-role: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { $ref: '#/components/responses/CaddyState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/sites/{siteId}/caddy/rollback:
    parameters:
      - $ref: '#/components/parameters/SiteId'
    post:
      operationId: rollbackCaddyConfiguration
      tags: [Sites]
      summary: Validate and reapply a previously applied configuration as a new revision
      x-required-platform-role: admin
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision]
              properties:
                revision: { type: integer, format: int64, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/CaddyState' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        default: { $ref: '#/components/responses/Problem' }
  /api/v1/admin/users:
    get:
      operationId: listUsers
      x-required-platform-role: admin
      tags: [Administration]
      summary: List and filter accounts as a platform administrator
      parameters:
        - $ref: '#/components/parameters/AdminPage'
        - $ref: '#/components/parameters/AdminPageSize'
        - $ref: '#/components/parameters/AdminSearch'
        - name: role
          in: query
          schema: { type: string, enum: [admin, member] }
        - name: status
          in: query
          description: Deleted accounts are excluded unless this is explicitly deleted.
          schema: { type: string, enum: [active, disabled, pending, deleted] }
      responses:
        '200':
          description: Filtered account page; never includes authentication material.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      x-required-platform-role: admin
      tags: [Administration]
      summary: Create a member account and a one-time registration code
      description: The code is valid for ten minutes, returned once and never logged. Redeeming it requires binding a passkey before business access. Roles and site access are granted through separate guarded endpoints.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProfileInput' }
      responses:
        '201': { $ref: '#/components/responses/AccountCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getUser
      x-required-platform-role: admin
      tags: [Administration]
      summary: Inspect an account, site memberships, passkeys and active sessions
      responses:
        '200':
          description: Metadata only; no cookie, CSRF token, user handle or credential bytes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteUser
      x-required-platform-role: admin
      tags: [Administration]
      summary: Permanently soft-delete an account and revoke its login artifacts
      description: Self-deletion, removing the last active administrator and removing the sole active owner of any site are refused. History and site files are retained. Deleted accounts cannot be restored.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Account deleted and live authentication artifacts revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/profile:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateUserProfile
      x-required-platform-role: admin
      tags: [Administration]
      summary: Update an account username and display name
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProfileInput' }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/role:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setUserRole
      x-required-platform-role: admin
      tags: [Administration]
      summary: Set the platform role without changing site memberships
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platformRole]
              properties:
                platformRole: { type: string, enum: [admin, member] }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    put:
      operationId: setUserStatus
      x-required-platform-role: admin
      tags: [Administration]
      summary: Disable or re-enable an account
      description: Disabling revokes sessions, codes and outstanding ceremonies. Re-enabling does not revive any old login artifact. The self, final administrator and active owner guards apply.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [active, disabled] }
      responses:
        '200': { $ref: '#/components/responses/AdminUser' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/login-code:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      operationId: issueUserLoginCode
      x-required-platform-role: admin
      tags: [Administration]
      summary: Issue a ten-minute recovery or registration code for an active account
      description: Previous unused codes are expired. The new code is returned once and never logged; existing passkeys are preserved.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '200': { $ref: '#/components/responses/AccountCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/site-access/{siteId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/SiteId'
    put:
      operationId: setUserSiteAccess
      x-required-platform-role: admin
      tags: [Administration]
      summary: Grant, change or remove a single site membership
      description: Empty role removes access. This never changes site content or publishes a website. Removing the final active owner is refused under the account lifecycle lock.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { type: string, enum: ['', owner, editor, viewer] }
      responses:
        '200':
          description: The saved membership.
          content:
            application/json:
              schema:
                type: object
                required: [siteId, role]
                properties:
                  siteId: { type: string, format: uuid }
                  role: { type: string, enum: ['', owner, editor, viewer] }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/sessions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    delete:
      operationId: revokeUserSessions
      x-required-platform-role: admin
      tags: [Administration]
      summary: Terminate every active session of one account
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Sessions revoked; the current cookie is cleared when affected. }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/SessionId'
    delete:
      operationId: revokeUserSession
      x-required-platform-role: admin
      tags: [Administration]
      summary: Terminate a session belonging to the specified account
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Session revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/users/{userId}/passkeys/{passkeyId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PasskeyId'
    delete:
      operationId: revokeUserPasskey
      x-required-platform-role: admin
      tags: [Administration]
      summary: Revoke a passkey and the account's live login artifacts
      description: The key UUID is metadata, never credential bytes. All sessions, unused codes and pending ceremonies for the account are revoked. Removing your own final passkey for the current RP is refused. Another account can recover through a newly issued code and binding.
      security:
        - sessionCookie: []
          csrfHeader: []
      responses:
        '204': { description: Passkey removed and login artifacts revoked. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AccountConflict' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/admin/audit:
    get:
      operationId: listAuditEvents
      x-required-platform-role: admin
      tags: [Audit]
      summary: Filter and page the append-only operation and authentication history
      description: Records begin when this version is deployed; historical events are not fabricated. Events contain operation IDs, route templates, UUID targets and outcomes, never request bodies, code values, cookies, credential bytes or raw query strings. Peer IP is the transport peer, not a forwarded header.
      parameters:
        - $ref: '#/components/parameters/AdminPage'
        - $ref: '#/components/parameters/AdminPageSize'
        - $ref: '#/components/parameters/AdminSearch'
        - name: actor
          in: query
          schema: { type: string, maxLength: 128 }
        - name: operation
          in: query
          schema: { type: string, maxLength: 128 }
        - name: outcome
          in: query
          schema: { type: string, enum: [success, failure] }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: until
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Audit page in descending timestamp and UUID order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        default: { $ref: '#/components/responses/Problem' }

  /api/v1/auth/register/options:
    post:
      operationId: startPasskeyEnrollment
      tags: [Auth]
      summary: Start passkey enrollment with a bootstrap permit
      description: |
        Exchanges a single-use enrollment permit (generated by the local
        `fuyao-admin bootstrap-admin` command) for WebAuthn credential
        creation options. The permit lookup is attempt-limited and expires
        quickly; the permit is only valid while no administrator has
        registered yet.

        The response sets a short-lived `fuyao_admin_auth_tx` cookie
        (HttpOnly, scoped to `/api/v1/auth`) that binds the ceremony state.
        The challenge is single-use and server-side enforced.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentPermitRequest'
            examples:
              permit:
                value: { 'permit': 'MFRG-GZYT-MZWU-4TCO' }
      responses:
        '200':
          description: Creation options for `navigator.credentials.create()`.
          headers:
            Set-Cookie:
              description: Ceremony cookie `fuyao_admin_auth_tx`; path /api/v1/auth; HttpOnly; SameSite=Lax.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationOptionsEnvelope'
        '400':
          $ref: '#/components/responses/InvalidPermit'
        '409':
          description: An administrator is already registered; the enrollment window is closed (`bootstrap_closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/register/verify:
    post:
      operationId: verifyPasskeyEnrollment
      tags: [Auth]
      summary: Complete passkey enrollment
      description: |
        Verifies the attestation produced by `navigator.credentials.create()`
        against the challenge bound to the `fuyao_admin_auth_tx` cookie. The
        ceremony state is consumed atomically before verification, so a
        challenge can never be replayed or brute-forced. On success the permit
        is claimed, the user becomes active, and a session cookie plus a
        one-time CSRF token are issued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreationResponse'
      responses:
        '200':
          description: Enrollment complete; the caller is signed in.
          headers:
            Set-Cookie:
              description: Session cookie `fuyao_admin_session` (HttpOnly, SameSite=Lax); the ceremony cookie is cleared.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyDone'
        '401':
          description: |
            Challenge unknown/expired/consumed (`challenge_invalid`) or the
            attestation failed verification (`credential_rejected`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                challenge:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unauthorized',
                      'status': 401,
                      'code': 'challenge_invalid',
                      'detail': 'The authentication challenge is unknown, expired, or already used.'
                    }
                rejected:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unauthorized',
                      'status': 401,
                      'code': 'credential_rejected',
                      'detail': 'The passkey registration response failed verification.'
                    }
        '409':
          description: |
            Enrollment closure: the permit was already used (`permit_used`),
            expired while its ceremony was in flight (`permit_expired`), or an
            administrator is already registered (`bootstrap_closed`). Permit
            consumption, credential write, and user activation commit in one
            transaction, so concurrent first enrollments never both succeed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: The body is not a single JSON object (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/login/options:
    post:
      operationId: startPasskeyLogin
      tags: [Auth]
      summary: Start discoverable passkey login
      description: |
        Returns assertion options for a discoverable-credential
        (`navigator.credentials.get()` with an empty allow list) login with
        user verification required. Sets the short-lived
        `fuyao_admin_auth_tx` ceremony cookie.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Assertion options for `navigator.credentials.get()`.
          headers:
            Set-Cookie:
              description: Ceremony cookie `fuyao_admin_auth_tx`; path /api/v1/auth; HttpOnly; SameSite=Lax.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssertionOptionsEnvelope'
        '400':
          description: The body is not a single JSON object (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Origin rejected (`origin_rejected`); unsafe methods require an allowed Origin.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/login/verify:
    post:
      operationId: verifyPasskeyLogin
      tags: [Auth]
      summary: Complete discoverable passkey login
      description: |
        Verifies the assertion against the challenge bound to the
        `fuyao_admin_auth_tx` cookie. The user is resolved from the
        authenticator's user handle; origin, RP ID hash, signature, user
        verification, and the signature counter are verified by the server.
        The ceremony state is consumed before verification, so challenges are
        single-use even on failure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialAssertionResponse'
      responses:
        '200':
          description: Login complete; a session cookie and CSRF token are issued.
          headers:
            Set-Cookie:
              description: Session cookie `fuyao_admin_session`; the ceremony cookie is cleared.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyDone'
        '401':
          description: Challenge invalid (`challenge_invalid`) or assertion rejected (`credential_rejected`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '400':
          description: The body is not a single JSON object (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/exchange:
    post:
      operationId: exchangeAuthCode
      tags: [Session]
      summary: Redeem a CLI-issued one-time code
      description: |
        Exchanges a single-use code printed by the server CLI
        (`fuyao-admin init-admin` for the first administrator,
        `fuyao-admin login-code` for identity confirmation and recovery) for
        a freshly minted session. Codes are stored as SHA-256 digests, expire
        quickly, burn one attempt per presentation, and are consumed in one
        transaction, so concurrent redemptions of the same code can never
        both succeed. An initialization code only activates the still-pending
        first administrator; a login code only opens sessions for active
        accounts. When the account owns no credential registered under the
        current relying-party ID, the minted session is a short-lived
        restricted registration session (`sessionScope: restricted`) that may
        only complete the passkey-binding ceremony; accounts already bound
        for the current RP receive a full session directly.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCodeExchangeRequest'
            examples:
              login:
                value: { code: 'AB2C-D4EF-GH2J-KL3M' }
      responses:
        '200':
          description: Code redeemed; the response sets the session cookie and returns the signed-in user with the CSRF token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyDone'
        '400':
          description: The code is unknown (`invalid_code`) or the body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            The code was already used (`code_used`), expired
            (`code_expired`), locked after too many presentations
            (`code_locked`), does not match the account state
            (`code_purpose_mismatch`), or initialization is already closed
            (`bootstrap_closed`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too many redemption attempts from this address (`rate_limited`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/passkey/register/options:
    post:
      operationId: startPasskeyBinding
      tags: [Auth]
      summary: Start session-bound passkey binding
      description: |
        Starts a WebAuthn registration ceremony for the session's own
        account. This is the only registration path once an administrator
        exists: the binding target comes exclusively from the authenticated
        session, never from the request body. A restricted registration
        session (issued when a one-time code confirmed the identity of an
        account without a credential for the current relying party) may call
        exactly this endpoint, its verify counterpart, the session read, and
        logout.

        The response sets the short-lived `fuyao_admin_auth_tx` cookie whose
        challenge is bound to both the account and this exact session; a
        challenge cannot be replayed or completed under another session.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Creation options for `navigator.credentials.create()`.
          headers:
            Set-Cookie:
              description: Ceremony cookie `fuyao_admin_auth_tx`; path /api/v1/auth; HttpOnly; SameSite=Lax.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreationOptionsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: The relying party is unavailable on this deployment (`passkey_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/passkey/register/verify:
    post:
      operationId: verifyPasskeyBinding
      tags: [Auth]
      summary: Complete session-bound passkey binding
      description: |
        Verifies the attestation against the challenge bound to the
        `fuyao_admin_auth_tx` cookie and to the current session. On success,
        in one transaction, the credential is stored tagged with the current
        relying-party ID, a fresh full session is minted, and the session
        that carried the ceremony is revoked; other restricted sessions of
        the same account are not upgraded. A cancelled or rejected ceremony
        consumes only the challenge: the restricted session stays alive and
        fresh options can be requested while it is valid.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialCreationResponse'
      responses:
        '200':
          description: Binding complete; the rotated full session cookie replaces the previous one.
          headers:
            Set-Cookie:
              description: Fresh session cookie `fuyao_admin_session` (HttpOnly, SameSite=Lax); the ceremony cookie is cleared.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CeremonyDone'
        '401':
          description: |
            Challenge unknown/expired/consumed or bound to another session
            (`challenge_invalid`), or the attestation failed verification
            (`credential_rejected`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The credential is already registered (`credential_duplicate`), or
            the session that requested the ceremony no longer exists
            (`session_rotated`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          description: The relying party is unavailable on this deployment (`passkey_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/session:
    get:
      operationId: getSession
      tags: [Session]
      summary: Query the current session
      description: |
        Returns the session state. An authenticated caller receives the
        session's stable CSRF token, identical on every read, so multiple
        tabs stay writable; an anonymous or expired caller receives
        `authenticated: false` (with status 200), so the endpoint doubles as
        the login-state probe for the admin front end.
      security:
        - sessionCookie: []
        - {}
      responses:
        '200':
          description: Session state. `user` and `csrfToken` are present only when authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
              examples:
                authenticated:
                  value:
                    authenticated: true
                    platformInitialized: true
                    user:
                      {
                        'id': '018f3c1e-6a2c-7b41-9f22-3f0a1c7d5b88',
                        'username': 'alice',
                        'displayName': 'Alice',
                        'platformRole': 'admin'
                      }
                    csrfToken: 'dGhpc0lzQUNzcmZUb2tlbg'
                    sessionScope: full
                    passkeyBound: true
                    passkeyAvailable: true
                restricted:
                  value:
                    authenticated: true
                    platformInitialized: true
                    user:
                      {
                        'id': '018f3c1e-6a2c-7b41-9f22-3f0a1c7d5b88',
                        'username': 'alice',
                        'displayName': 'Alice',
                        'platformRole': 'admin'
                      }
                    csrfToken: 'dGhpc0lzQUNzcmZUb2tlbg'
                    sessionScope: restricted
                    passkeyBound: false
                    passkeyAvailable: true
                anonymous:
                  value:
                    {
                      'authenticated': false,
                      'platformInitialized': true,
                      'passkeyBound': false,
                      'passkeyAvailable': true
                    }
                uninitialized:
                  value:
                    {
                      'authenticated': false,
                      'platformInitialized': false,
                      'passkeyBound': false,
                      'passkeyAvailable': true
                    }
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [Session]
      summary: Revoke the current session
      description: |
        Revokes the session server-side and clears the cookie. Requires the
        session cookie, the CSRF token header, and an allowed Origin.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/account/profile:
    patch:
      operationId: updateAccountProfile
      tags: [Account]
      summary: Rename the caller's own account
      description: |
        Self-service account rename. The target is always the caller's own
        account — the endpoint never accepts a user id. The rename is one
        atomic UPDATE: the account UUID, the WebAuthn user handle, every
        passkey credential, and all role memberships are untouched, so
        existing credentials keep working across the rename. The username
        format mirrors the database CHECK constraint; a collision with
        another account answers `username_taken`.
      security:
        - sessionCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountProfileUpdate'
      responses:
        '200':
          description: The renamed account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: The body is missing or malformed (`invalid_json`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Another account already uses this username (`username_taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The username does not match the required format (`validation_error`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites:
    get:
      operationId: listSites
      tags: [Sites]
      summary: List sites the caller belongs to
      description: Returns exactly the sites in which the authenticated user holds a membership, newest first.
      responses:
        '200':
          description: Membership-scoped site list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteList'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createSite
      tags: [Sites]
      summary: Create a site
      description: |
        Creates a site owned by the caller: database rows (site, settings,
        owner membership) commit in one transaction, an optional initial
        theme selection is validated exactly like a theme PUT, and then the
        per-site content/config directory tree is provisioned. The response
        reports the provisioning state explicitly — a created site is only
        `ready` once directory setup succeeded; `failed` keeps the site
        retryable via the provision endpoint. Slug uniqueness is enforced by
        the database.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/CSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteCreate'
            examples:
              minimal:
                value: { 'slug': 'personal', 'name': 'My Homepage', 'defaultLocale': 'zh-CN' }
              withTheme:
                value:
                  {
                    'slug': 'personal',
                    'name': 'My Homepage',
                    'defaultLocale': 'zh-CN',
                    'visibility': 'private',
                    'themeId': 'fuyao-homepage',
                    'themeVersion': '27.1.1',
                    'themeConfig': {}
                  }
      responses:
        '201':
          description: Site created; `provisionState` says whether directory provisioning succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          description: Field validation failed (`validation_error`) or the body is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The requested theme and version are not registered (`theme_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: A site with this slug already exists (`slug_taken`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The theme configuration is invalid (`invalid_theme_config`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Theme contracts (`theme_contracts_unavailable`) or site provisioning (`provisioning_unavailable`) are not configured.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/provision:
    post:
      operationId: provisionSite
      tags: [Sites]
      summary: Retry site directory provisioning
      description: |
        Re-runs the on-disk provisioning for a site whose `provisionState` is
        not `ready`. Idempotent: provisioning never overwrites existing
        files, and a site that is already ready is returned unchanged.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      responses:
        '200':
          description: The refreshed site with its current provisioning state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: Site provisioning is not configured (`provisioning_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}:
    get:
      operationId: getSite
      tags: [Sites]
      summary: Get one member site
      description: Returns the site with the caller's role. Non-members receive 404 so site existence is not leaked across accounts.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Site'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/settings:
    get:
      operationId: getSiteSettings
      tags: [Sites]
      summary: Read site settings
      description: Returns the editable settings plus the strong ETag used for optimistic concurrency. Any member (including viewers) may read.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Current settings.
          headers:
            ETag:
              description: Strong entity tag `"<siteId>-r<revision>"` for use in If-Match.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateSiteSettings
      tags: [Sites]
      summary: Update site settings (If-Match required)
      description: |
        Partially updates `name`, `description`, and `defaultLocale`. The
        request must carry the session cookie, the CSRF token header, an
        allowed Origin, and an `If-Match` header with this site's exact ETag
        from a prior GET (wildcards are rejected). The ETag embeds the site
        UUID, so tags belonging to other sites fail even at equal revisions.
        The revision comparison and bump happen inside one PostgreSQL
        transaction, so concurrent writers cannot both succeed.

        Only `owner` and `editor` members may write; viewers get 403 and
        non-members get 404. Unknown JSON fields, empty patches, invalid
        locales, and over-length values are rejected with 400.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteSettingsPatch'
            examples:
              rename:
                value: { 'name': 'Fuyao Blog', 'defaultLocale': 'en-US' }
      responses:
        '200':
          description: Updated settings; a new strong ETag is returned.
          headers:
            ETag:
              description: Strong ETag of the new revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteSettings'
        '400':
          description: Validation failure (`validation_error` or `invalid_if_match`/`invalid_site_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknownField:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Bad Request',
                      'status': 400,
                      'code': 'validation_error',
                      'detail': 'Invalid JSON body: json: unknown field "unexpected"'
                    }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          description: The ETag is stale or belongs to a different resource (`precondition_failed`); the current ETag is returned in the ETag response header.
          headers:
            ETag:
              description: Current (fresher) entity tag.
              schema: { type: string }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: If-Match is missing (`precondition_required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/themes:
    get:
      operationId: listThemes
      tags: [Themes]
      summary: List registered themes
      description: |
        Returns the theme catalog. Entries are registered by the
        operator-driven `fuyao-admin register-theme` CLI; each entry carries
        the validated manifest content, the manifest digest that distinguishes
        registrations, and the theme's own configuration schema for rendering
        the per-site configuration form. Server-side source paths and other
        filesystem details are never exposed. Any authenticated administrator
        may read the catalog, viewers included.
      responses:
        '200':
          description: Theme catalog, ordered by theme id and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThemeList'
              examples:
                firstTheme:
                  value:
                    themes:
                      - id: '0192ab3c-4d5e-6f70-8192-ab3c4d5e6f70'
                        themeId: fuyao-homepage
                        version: '27.1.1'
                        name: Fuyao Homepage
                        description: The original SvelteKit public site registered as the first theme.
                        adapter: node22-sveltekit-static
                        inputProtocol: fuyao.theme.build-input/v1
                        capabilities: [blog, albums, footprint, friends, pay, favicon]
                        outputs:
                          spaFallback: 200.html
                          urlConventions:
                            [
                              release.json,
                              posts,
                              data,
                              media-albums,
                              sitemap,
                              blog-rss,
                              blog-search
                            ]
                          requiredArtifacts: [sitemap.xml, blog/rss.xml]
                        configSchema:
                          {
                            '$schema': 'https://json-schema.org/draft/2020-12/schema',
                            'title': 'Fuyao Homepage theme configuration (v1)',
                            'type': 'object',
                            'additionalProperties': false
                          }
                        manifestDigest: '9f2c7c14ad5b3e6f8192ab3c4d5e6f701234567890abcdef12345678abcdef12'
                        registeredAt: '2026-11-11T08:00:00Z'
                        updatedAt: '2026-11-11T08:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/sites/{siteId}/theme:
    get:
      operationId: getSiteTheme
      tags: [Themes]
      summary: Read the site theme selection
      description: |
        Returns the site's selected theme registration and its configuration
        plus the strong ETag used for optimistic concurrency. Revision 0 with
        `selected: false` means no selection yet (ETag `"<siteId>-t0"`). Any
        member (including viewers) may read; non-members get 404. The theme
        selection revision is independent of the site settings revision, so
        editing settings never overwrites a concurrent theme selection and
        vice versa.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Current selection.
          headers:
            ETag:
              description: Strong entity tag `"<siteId>-t<revision>"` for use in If-Match.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteThemeSelection'
        '400':
          $ref: '#/components/responses/InvalidSiteId'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: putSiteTheme
      tags: [Themes]
      summary: Save the site theme selection (If-Match required)
      description: |
        Saves the site's theme selection and its configuration. The theme and
        version must exist in the catalog (404 `theme_not_found` otherwise),
        and the configuration must satisfy the theme's own configuration
        schema (422 `invalid_theme_config`; themes without a declared schema
        accept only `{}`). Invalid input is never silently downgraded.

        The request must carry the session cookie, the CSRF token header, an
        allowed Origin, and an `If-Match` header with this site's exact theme
        ETag from a prior GET (wildcards are rejected). Revision 0 creates the
        first selection. The revision comparison and bump happen inside one
        PostgreSQL transaction on a counter independent of the site settings
        revision.

        Only `owner` and `editor` members may write; viewers get 403 and
        non-members get 404. Servers started without
        `FUYAO_ADMIN_THEME_CONTRACTS` reject the save with 503
        `theme_contracts_unavailable` instead of skipping validation.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteThemeSelectionPut'
            examples:
              selectFirstTheme:
                value: { 'themeId': 'fuyao-homepage', 'version': '27.1.1', 'themeConfig': {} }
      responses:
        '200':
          description: Saved selection; a new strong ETag is returned.
          headers:
            ETag:
              description: Strong ETag of the new revision.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteThemeSelection'
        '400':
          description: Validation failure (`validation_error` or `invalid_if_match`/`invalid_site_id`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Site or theme not found (`not_found` or `theme_not_found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                themeNotFound:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Not Found',
                      'status': 404,
                      'code': 'theme_not_found',
                      'detail': 'The theme and version are not registered in the catalog.'
                    }
        '412':
          description: The ETag is stale or belongs to a different resource (`precondition_failed`); the current ETag is returned in the ETag response header.
          headers:
            ETag:
              description: Current (fresher) entity tag.
              schema: { type: string }
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          $ref: '#/components/responses/RequestBodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: The theme configuration does not satisfy the theme's configuration schema (`invalid_theme_config`). The exact validation error is logged server-side; the response detail never embeds validator internals or local paths.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                unknownOption:
                  value:
                    {
                      'type': 'about:blank',
                      'title': 'Unprocessable Entity',
                      'status': 422,
                      'code': 'invalid_theme_config',
                      'detail': "The theme configuration does not satisfy the theme's configuration schema."
                    }
        '428':
          description: If-Match is missing (`precondition_required`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Theme contract validation is not configured on the server (`theme_contracts_unavailable`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

