        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPost
      tags: [Content]
      summary: Create a markdown post
      description: |
        Writes a new post under `posts/<category>/<slug>.md`. Creating over an
        existing path answers 409; the response carries the digest ETag used
        for later read-modify-write saves.
      security:
        - sessionCookie: []
          csrfHeader: []
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Post'
            examples:
              simple:
                value:
                  {
                    'category': 'tech',
                    'slug': 'hello-world',
                    'title': 'Hello World',
                    'date': '2026-11-11T10:00:00.000Z',
                    'draft': false,
                    'categories': ['技术开发'],
                    'tags': ['hello'],
                    'body': 'First post.'
                  }
      responses:
        '201':
          description: The created post.
          headers:
            ETag:
              description: Quoted digest ETag for If-Match saves.
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Field validation failed (`validation_error`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A post already exists at this path (`content_exists`).
          content:
