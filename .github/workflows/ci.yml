name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      theme-ref:
        description: 'FuyaoHomepage ref for the external-theme integration job'
        required: false
        default: 'main'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fuyao_test
          POSTGRES_DB: fuyao_mvp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuyao_test -d fuyao_mvp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUYAO_ADMIN_TEST_DSN: postgresql://fuyao_test@localhost:5432/fuyao_mvp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
        working-directory: backend
      - run: go build ./...
        working-directory: backend
      - name: go test (real PostgreSQL, integration included)
        working-directory: backend
        run: go test ./... -v -count=1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci (isolated frontend lockfile)
        working-directory: frontend
        run: npm ci
      - name: OpenAPI type drift check
        working-directory: frontend
        run: npm run api:check
      - name: OpenAPI semantic lint
        working-directory: frontend
        run: npm run api:lint
      - name: typecheck
        working-directory: frontend
        run: npm run check
      - name: vitest
        working-directory: frontend
        run: npm test
      - name: build
        working-directory: frontend
        run: npm run build

  # Real external-theme integration: checks out the first theme (FuyaoHomepage)
  # at a pinned ref, installs its dependencies, and runs the Go suite with
  # FUYAO_TEST_THEME_ROOT so the real Node/SvelteKit build tests execute.
  # Manual (workflow_dispatch) until the theme repository carries the split
  # on its default branch.
  backend-theme-integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: fuyao_test
          POSTGRES_DB: fuyao_mvp_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuyao_test -d fuyao_mvp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FUYAO_ADMIN_TEST_DSN: postgresql://fuyao_test@localhost:5432/fuyao_mvp_test?sslmode=disable
      FUYAO_TEST_THEME_ROOT: ${{ github.workspace }}/theme/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: skyrocketingHong/FuyaoHomepage
          ref: ${{ github.event.inputs.theme-ref || 'main' }}
          path: theme
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: theme/package-lock.json
      - name: theme dependencies
        working-directory: theme
        run: npm ci
      - name: go test (real theme builds included)
        working-directory: backend
        run: go test ./... -v -count=1
